<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bridge Race 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 全ブラウザ・全モバイル環境で100%確実に動作するThree.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #7dd3fc;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #touch-control-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      touch-action: none;
    }
    .hidden {
      display: none !important;
    }
    .safe-padding {
      padding-top: env(safe-area-inset-top, 16px);
      padding-bottom: env(safe-area-inset-bottom, 16px);
      padding-left: env(safe-area-inset-left, 16px);
      padding-right: env(safe-area-inset-right, 16px);
    }
  </style>
</head>
<body class="text-white">

  <!-- 3D Canvas Viewport -->
  <div id="canvas-container"></div>
  
  <!-- Virtual Touch Input Layer (全画面スワイプ操作) -->
  <div id="touch-control-layer"></div>

  <!-- HUD Interface Overlay (完全オープン視界・数字＋単位直結) -->
  <div class="fixed top-0 inset-x-0 z-20 pointer-events-none p-4 sm:p-6 safe-padding flex justify-between items-start">
    <!-- スコア (特大ゴールド数字 + 段) -->
    <div class="flex items-baseline drop-shadow-[0_2px_10px_rgba(0,0,0,0.85)] select-none">
      <span id="hud-score" class="text-3xl sm:text-4xl font-black text-amber-300 font-mono tracking-tight leading-none">0</span>
      <span class="text-sm sm:text-base font-black text-amber-200 ml-1">段</span>
    </div>

    <!-- タイマー (中央上・控えめデジタル数字のみ：5分) -->
    <div class="flex items-center drop-shadow-[0_2px_8px_rgba(0,0,0,0.85)] select-none pt-0.5">
      <span id="hud-timer" class="text-base sm:text-lg font-bold text-white/90 font-mono tracking-widest leading-none">05:00</span>
    </div>

    <!-- 所持数 (手持ちリソース・白数字 + 個) -->
    <div class="flex items-baseline drop-shadow-[0_2px_10px_rgba(0,0,0,0.85)] select-none">
      <span id="hud-stack-count" class="text-2xl sm:text-3xl font-black text-white font-mono tracking-tight leading-none">0</span>
      <span class="text-sm sm:text-base font-black text-slate-200 ml-1">個</span>
    </div>
  </div>

  <!-- Floating Sound Button -->
  <div class="fixed bottom-0 right-0 z-20 p-4 sm:p-6 safe-padding pointer-events-none flex justify-end items-end">
    <button id="btn-sound" type="button" aria-label="Toggle Sound" class="pointer-events-auto w-11 h-11 rounded-full bg-slate-900/80 backdrop-blur-md border border-white/15 flex items-center justify-center shadow-lg hover:bg-slate-800 active:scale-90 transition cursor-pointer">
      <svg id="icon-sound-off" class="w-5 h-5 text-slate-400 fill-current" viewBox="0 0 24 24">
        <path d="M3.63 3.63a.996.996 0 000 1.41L7.29 8.7 7 9H4c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1h3l3.29 3.29c.63.63 1.71.18 1.71-.71v-4.17l4.18 4.18c-.49.37-1.02.68-1.6.91-.36.15-.58.53-.58.92 0 .69.67 1.2 1.33.97.8-.29 1.53-.72 2.18-1.25l1.39 1.39a.996.996 0 101.41-1.41L5.05 3.63a.996.996 0 00-1.42 0zM19 12c0 .82-.15 1.61-.41 2.34l1.53 1.53c.56-1.17.88-2.48.88-3.87 0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zm-7-8l-1.88 1.88L12 7.76zm4.5 8A4.5 4.5 0 0014 7.97v1.79l2.48 2.48c.01-.08.02-.16.02-.24z"/>
      </svg>
      <svg id="icon-sound-on" class="w-5 h-5 text-cyan-400 fill-current hidden" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
    </button>
  </div>

  <!-- Start Screen Modal -->
  <div id="modal-start" class="fixed inset-0 z-50 bg-slate-950/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-950/80 backdrop-blur-md border border-cyan-400/25 p-7 sm:p-8 rounded-[28px] max-w-xs sm:max-w-sm w-full text-center shadow-[0_15px_40px_rgba(0,0,0,0.5)] pointer-events-auto">
      <h2 class="text-2xl sm:text-3xl font-black text-cyan-400 tracking-wider mb-4">
        階段を架けろ！
      </h2>
      <div class="space-y-2 text-slate-200 text-xs sm:text-sm font-medium leading-relaxed mb-6">
        <p>画面をなぞってブロックを集める</p>
        <p>ブロックで階段を架けて登る</p>
      </div>
      <button id="btn-start" type="button" class="w-full py-3.5 rounded-full border-2 border-cyan-400/80 bg-cyan-950/30 hover:bg-cyan-900/50 active:scale-95 text-cyan-300 font-extrabold text-sm sm:text-base tracking-[0.2em] shadow-[0_0_20px_rgba(6,182,212,0.3)] transition duration-200 cursor-pointer">
        TAP TO START
      </button>
    </div>
  </div>

  <!-- Result Screen Modal -->
  <div id="modal-result" class="fixed inset-0 z-50 bg-slate-950/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-950/80 backdrop-blur-md border border-cyan-400/25 p-7 sm:p-8 rounded-[28px] max-w-xs sm:max-w-sm w-full text-center shadow-[0_15px_40px_rgba(0,0,0,0.5)] pointer-events-auto">
      <h2 class="text-2xl sm:text-3xl font-black text-cyan-400 tracking-wider mb-5">TIME UP!</h2>
      <div class="bg-slate-900/60 rounded-2xl p-4 mb-6 border border-white/5">
        <div class="text-xs text-slate-400 font-semibold">最終スコア (架けた階段数)</div>
        <div id="modal-rank" class="text-3xl sm:text-4xl font-black text-amber-400 mt-1">0 段</div>
      </div>
      <button id="btn-restart" type="button" class="w-full py-3.5 rounded-full border-2 border-cyan-400/80 bg-cyan-950/30 hover:bg-cyan-900/50 active:scale-95 text-cyan-300 font-extrabold text-sm sm:text-base tracking-[0.2em] shadow-[0_0_20px_rgba(6,182,212,0.3)] transition duration-200 cursor-pointer">
        RETRY
      </button>
    </div>
  </div>

  <script>
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = true;
        this.lastSlideSound = 0;
        this.lastZipSound = 0;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }
      autoDisconnect(osc, ...nodes) {
        if (!osc) return;
        osc.onended = () => {
          try {
            osc.disconnect();
            nodes.forEach(n => {
              if (n && n.disconnect) n.disconnect();
            });
          } catch(e) {}
        };
      }
      playCollect(pitch = 1) {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(460 * pitch, now);
          osc.frequency.exponentialRampToValueAtTime(920 * pitch, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          this.autoDisconnect(osc, gain);
          osc.start(now);
          osc.stop(now + 0.09);
        } catch(e) {}
      }
      playGateBoost() {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const notes = [587.33, 880, 1174.66];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = now + idx * 0.05;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.25, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.16);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            this.autoDisconnect(osc, gain);
            osc.start(start);
            osc.stop(start + 0.17);
          });
        } catch(e) {}
      }
      playItemGet() {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(587.33, now);
          osc1.frequency.exponentialRampToValueAtTime(1174.66, now + 0.12);
          gain1.gain.setValueAtTime(0.28, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          this.autoDisconnect(osc1, gain1);
          osc1.start(now);
          osc1.stop(now + 0.23);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, now + 0.04);
          osc2.frequency.exponentialRampToValueAtTime(1760, now + 0.2);
          gain2.gain.setValueAtTime(0.32, now + 0.04);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          this.autoDisconnect(osc2, gain2);
          osc2.start(now + 0.04);
          osc2.stop(now + 0.29);
        } catch(e) {}
      }
      playAttackShoot() {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sawtooth';
          osc1.frequency.setValueAtTime(740, now);
          osc1.frequency.exponentialRampToValueAtTime(2400, now + 0.13);
          gain1.gain.setValueAtTime(0.26, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          this.autoDisconnect(osc1, gain1);
          osc1.start(now);
          osc1.stop(now + 0.14);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(1480, now + 0.02);
          osc2.frequency.exponentialRampToValueAtTime(3400, now + 0.15);
          gain2.gain.setValueAtTime(0.24, now + 0.02);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          this.autoDisconnect(osc2, gain2);
          osc2.start(now + 0.02);
          osc2.stop(now + 0.16);
        } catch(e) {}
      }
      playAttackHit() {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(280, now);
          osc1.frequency.exponentialRampToValueAtTime(50, now + 0.24);
          gain1.gain.setValueAtTime(0.42, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          this.autoDisconnect(osc1, gain1);
          osc1.start(now);
          osc1.stop(now + 0.26);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sawtooth';
          osc2.frequency.setValueAtTime(1100, now);
          osc2.frequency.exponentialRampToValueAtTime(160, now + 0.16);
          gain2.gain.setValueAtTime(0.26, now);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          this.autoDisconnect(osc2, gain2);
          osc2.start(now);
          osc2.stop(now + 0.17);
        } catch(e) {}
      }
      playDrainCollect(pitchStep = 0) {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const freqs = [1760, 2093, 2637, 3136];
          const baseFreq = freqs[pitchStep % freqs.length];

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.25, now + 0.13);
          gain.gain.setValueAtTime(0.32, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          this.autoDisconnect(osc, gain);
          osc.start(now);
          osc.stop(now + 0.16);

          const chime = this.ctx.createOscillator();
          const cGain = this.ctx.createGain();
          chime.type = 'triangle';
          chime.frequency.setValueAtTime(baseFreq * 1.8, now + 0.02);
          chime.frequency.exponentialRampToValueAtTime(baseFreq * 2.2, now + 0.12);
          cGain.gain.setValueAtTime(0.20, now + 0.02);
          cGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          chime.connect(cGain);
          cGain.connect(this.ctx.destination);
          this.autoDisconnect(chime, cGain);
          chime.start(now + 0.02);
          chime.stop(now + 0.15);
        } catch(e) {}
      }
      playMagnetCharge() {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(440, now);
          osc1.frequency.exponentialRampToValueAtTime(1760, now + 0.28);
          gain1.gain.setValueAtTime(0.24, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          this.autoDisconnect(osc1, gain1);
          osc1.start(now);
          osc1.stop(now + 0.36);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(880, now + 0.05);
          osc2.frequency.exponentialRampToValueAtTime(2200, now + 0.28);
          gain2.gain.setValueAtTime(0.18, now + 0.05);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          this.autoDisconnect(osc2, gain2);
          osc2.start(now + 0.05);
          osc2.stop(now + 0.36);
        } catch(e) {}
      }
      playMagnetDock(step = 0) {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const freqs = [880, 987.77, 1108.73, 1174.66, 1318.51, 1396.91];
          const freq = freqs[step % freqs.length];

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.15, now + 0.06);
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          this.autoDisconnect(osc, gain);
          osc.start(now);
          osc.stop(now + 0.08);
        } catch(e) {}
      }
      playBuildPlank() {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(560, now + 0.07);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          this.autoDisconnect(osc, gain);
          osc.start(now);
          osc.stop(now + 0.08);
        } catch(e) {}
      }
      playSlide() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        if (now - this.lastSlideSound < 0.12) return;
        this.lastSlideSound = now;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(440, now + 0.1);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          this.autoDisconnect(osc, gain);
          osc.start(now);
          osc.stop(now + 0.11);
        } catch(e) {}
      }
      playZipline(speedProgress = 0.5) {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        if (now - this.lastZipSound < 0.08) return;
        this.lastZipSound = now;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          const baseFreq = 480 + speedProgress * 320 + Math.random() * 60;
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.linearRampToValueAtTime(baseFreq + 120, now + 0.075);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          this.autoDisconnect(osc, gain);
          osc.start(now);
          osc.stop(now + 0.08);
        } catch(e) {}
      }
      playLanding() {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(220, now);
          osc1.frequency.exponentialRampToValueAtTime(75, now + 0.18);
          gain1.gain.setValueAtTime(0.42, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          this.autoDisconnect(osc1, gain1);
          osc1.start(now);
          osc1.stop(now + 0.19);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, now + 0.02);
          osc2.frequency.exponentialRampToValueAtTime(1320, now + 0.24);
          gain2.gain.setValueAtTime(0.28, now + 0.02);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          this.autoDisconnect(osc2, gain2);
          osc2.start(now + 0.02);
          osc2.stop(now + 0.25);
        } catch(e) {}
      }
      playJump(tierId = 'normal') {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          if (tierId === 'normal') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.25);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            this.autoDisconnect(osc, gain);
            osc.start(now);
            osc.stop(now + 0.26);
          } else if (tierId === 'high') {
            const osc1 = this.ctx.createOscillator();
            const gain1 = this.ctx.createGain();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(120, now);
            osc1.frequency.exponentialRampToValueAtTime(1320, now + 0.42);
            gain1.gain.setValueAtTime(0.34, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
            osc1.connect(gain1);
            gain1.connect(this.ctx.destination);
            this.autoDisconnect(osc1, gain1);
            osc1.start(now);
            osc1.stop(now + 0.43);

            const osc2 = this.ctx.createOscillator();
            const gain2 = this.ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(587.33, now);
            osc2.frequency.exponentialRampToValueAtTime(1760, now + 0.42);
            gain2.gain.setValueAtTime(0.25, now);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
            osc2.connect(gain2);
            gain2.connect(this.ctx.destination);
            this.autoDisconnect(osc2, gain2);
            osc2.start(now);
            osc2.stop(now + 0.43);
          } else if (tierId === 'mega') {
            const subOsc = this.ctx.createOscillator();
            const subGain = this.ctx.createGain();
            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(95, now);
            subOsc.frequency.exponentialRampToValueAtTime(32, now + 0.32);
            subGain.gain.setValueAtTime(0.58, now);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
            subOsc.connect(subGain);
            subGain.connect(this.ctx.destination);
            this.autoDisconnect(subOsc, subGain);
            subOsc.start(now);
            subOsc.stop(now + 0.33);

            const sawOsc = this.ctx.createOscillator();
            const sawGain = this.ctx.createGain();
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(400, now);
            filter.frequency.linearRampToValueAtTime(3500, now + 0.65);

            sawOsc.type = 'sawtooth';
            sawOsc.frequency.setValueAtTime(160, now);
            sawOsc.frequency.exponentialRampToValueAtTime(2200, now + 0.65);
            sawGain.gain.setValueAtTime(0.32, now);
            sawGain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
            sawOsc.connect(filter);
            filter.connect(sawGain);
            sawGain.connect(this.ctx.destination);
            this.autoDisconnect(sawOsc, filter, sawGain);
            sawOsc.start(now);
            sawOsc.stop(now + 0.66);

            const chNotes = [1318.5, 1760.0, 2637.0];
            chNotes.forEach((freq, idx) => {
              const chOsc = this.ctx.createOscillator();
              const chGain = this.ctx.createGain();
              const startT = now + 0.22 + idx * 0.08;
              chOsc.type = 'sine';
              chOsc.frequency.setValueAtTime(freq, startT);
              chGain.gain.setValueAtTime(0.24, startT);
              chGain.gain.exponentialRampToValueAtTime(0.001, startT + 0.30);
              chOsc.connect(chGain);
              chGain.connect(this.ctx.destination);
              this.autoDisconnect(chOsc, chGain);
              chOsc.start(startT);
              chOsc.stop(startT + 0.32);
            });
          }
        } catch(e) {}
      }
      playTackle() {
        if (this.muted || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.18);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          this.autoDisconnect(osc, gain);
          osc.start(now);
          osc.stop(now + 0.19);
        } catch(e) {}
      }
      playVictory() {
        if (this.muted || !this.ctx) return;

          const notes = [523.25, 659.25, 783.99, 1046.5];

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = this.ctx.currentTime + idx * 0.12;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.25, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            this.autoDisconnect(osc, gain);
            osc.start(start);
            osc.stop(start + 0.37);
          });
        } catch(e) {}

    function createSeaTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 512; cvs.height = 512;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
      ctx.lineWidth = 3.5;
      for (let x = 0; x < 512; x += 64) {
        ctx.beginPath();
        for (let y = 0; y <= 512; y += 32) {
          const offsetX = Math.sin((y + x) * 0.05) * 12;
          if (y === 0) ctx.moveTo(x + offsetX, y);
          else ctx.lineTo(x + offsetX, y);
        }
        ctx.stroke();
      }
      for (let y = 0; y < 512; y += 64) {
        ctx.beginPath();
        for (let x = 0; x <= 512; x += 32) {
          const offsetY = Math.cos((x + y) * 0.05) * 12;
          if (y === 0) ctx.moveTo(x, y + offsetY);
          else ctx.lineTo(x, y + offsetY);
        }
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(cvs);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(48, 48);
      return tex;
    }

    function getOrCreateGateTexture(label, isPositive) {
      const cacheKey = `${label}_${isPositive}`;
      if (gateTextureCache.has(cacheKey)) {
        return gateTextureCache.get(cacheKey);
      }

      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = isPositive ? 'rgba(16, 185, 129, 0.78)' : 'rgba(239, 68, 68, 0.78)';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 10;
      
      const r = 24, w = 236, h = 236, x = 10, y = 10;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y + r, x + r, y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 84px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 128, 128);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      gateTextureCache.set(cacheKey, texture);
      return texture;
    }

    function triggerLandingShockwave(x, y, z, customRadius = 1.5, customColorHex = null) {
      let sw = shockwavePool.find(item => !item.active);
      if (!sw) {
        sw = shockwavePool[0];
        let maxLife = sw.life;
        for (let i = 1; i < shockwavePool.length; i++) {
          if (shockwavePool[i].life > maxLife) {
            maxLife = shockwavePool[i].life;
            sw = shockwavePool[i];
          }
        }
      }

      sw.active = true;
      sw.life = 0;
      sw.scale = 1.0;
      sw.targetRadiusScale = customRadius / 1.5;
      sw.mesh.position.set(x, y + 0.08, z);
      sw.mesh.scale.set(1.0, 1.0, 1.0);
      sw.mesh.material.opacity = 0.9;
      sw.mesh.material.color.setHex(customColorHex || 0x38bdf8);
      sw.mesh.visible = true;

      if (drainBlockPool.length === 0) {

      const sandMesh = new THREE.Mesh(sandGeo, sharedMats.oceanSand);

      group.add(sandMesh);

      const grassR = sandR * 0.62;
      const grassGeo = new THREE.CylinderGeometry(grassR * 0.8, grassR, 0.55, 12);
      const grassMesh = new THREE.Mesh(grassGeo, sharedMats.oceanGrass);
      grassMesh.position.y = 0.85;
      grassMesh.receiveShadow = false;
      group.add(grassMesh);

      if (type === 'tropical') {
        const trunkH = (3.2 + Math.random() * 1.5) * scale;

          );
          leaf.rotation.y = leafAng;
          leaf.rotation.z = 0.35;
          group.add(leaf);

    function spawnItem(stageIdx, type = 'speed') {
      const stageInfo = STAGES[stageIdx];
      if (!stageInfo) return;

      const minClearanceSq = 1.6 * 1.6;
      let validPos = null;
      let attempts = 0;
      const stageBlocks = getFloorBlocksForStage(stageIdx);

      while (attempts < 20) {
        const r = Math.sqrt(Math.random()) * (stageInfo.r - 2.8);
        const theta = Math.random() * Math.PI * 2;
        const candX = Math.cos(theta) * r;
        const candZ = stageInfo.z + Math.sin(theta) * r;

        let isOverlapping = false;
        for (let i = 0; i < stageBlocks.length; i++) {
          const b = stageBlocks[i];
          if (b.active) {
            const dx = b.pos.x - candX;
            const dz = b.pos.z - candZ;
            if (dx * dx + dz * dz < minClearanceSq) {
              isOverlapping = true;
              break;
            }
          }
        }
        if (!isOverlapping) {
          validPos = { x: candX, z: candZ };
          break;
        }
        attempts++;
      }
      if (!validPos) return;

      const itemGroup = new THREE.Group();
      let crystalMat, ringMat;
      if (type === 'attack') {
        crystalMat = sharedMats.itemAttackCrystal;
        ringMat = sharedMats.itemAttackBeaconRing;
      } else if (type === 'magnet') {
        crystalMat = sharedMats.itemMagnetCrystal;
        ringMat = sharedMats.itemMagnetBeaconRing;
      } else {
        crystalMat = sharedMats.itemCrystal;
        ringMat = sharedMats.itemBeaconRing;
      }

      const crystal = new THREE.Mesh(itemCrystalGeo, crystalMat);
      crystal.position.y = 1.35;
      crystal.castShadow = true;
      itemGroup.add(crystal);

      const beaconRing = new THREE.Mesh(itemBeaconRingGeo, ringMat);
      beaconRing.position.y = 0.04;
      itemGroup.add(beaconRing);

      itemGroup.position.set(validPos.x, stageInfo.y, validPos.z);
      scene.add(itemGroup);

      floorItems.push({
        group: itemGroup,
        crystal: crystal,
        beaconRing: beaconRing,
        mesh: itemGroup,
        type: type,
        pos: itemGroup.position,
        active: true,
        stageIdx: stageIdx,
        baseY: stageInfo.y
      });
    }

    function extendCourse() {
      const idx = STAGES.length;
      let prev = STAGES[idx - 1];
      let type, nextY, r, distZ;
      
      if (idx <= 2) {
        type = 'bridge';
        nextY = prev.y + 7.0;
        distZ = 34;
        r = 10;
      } else if (idx === 3) {
        type = 'curved_slide';
        nextY = prev.y - 8.5;
        distZ = 46;
        r = 11;
      } else if (idx === 4) {
        type = 'vertical';
        nextY = prev.y + 12.0;
        distZ = 24;
        r = 10;
      } else if (idx === 5) {
        type = 'zipline';
        nextY = Math.max(7.0, prev.y - 10.5);
        distZ = 68;
        r = 10.5;
      } else {
        const rand = Math.random();
        
        if (prev.y >= 14.0) {
          if (rand < 0.35) {
            type = 'zipline';
            nextY = Math.max(7.0, prev.y - 10.5);
            distZ = 68;
            r = 10.5;
          } else if (rand < 0.70) {
            type = 'curved_slide';
            nextY = Math.max(6.0, prev.y - 8.0);
            distZ = 46;
            r = 11;
          } else {
            type = 'slide';
            nextY = Math.max(6.0, prev.y - 6.5);
            distZ = 36;
            r = 10;
          }
        } else {
          if (rand < 0.25) {
            type = 'vertical';
            nextY = prev.y + 10.0;
            distZ = 24;
            r = 10;
          } else if (rand < 0.40) {
            type = 'jump';
            nextY = prev.y + 1.0;
            distZ = 30;
            r = 9.5;
          } else if (rand < 0.65) {
            type = 'bridge';
            nextY = prev.y + 7.0;
            distZ = 34;
            r = 10;
          } else {
            type = 'curved_slide';
            nextY = Math.max(6.0, prev.y - 4.0);
            distZ = 46;
            r = 11;
          }
        }
      }

      nextY = Math.max(6.0, nextY);
      
      const nextZ = prev.z - distZ; 
      const stageInfo = { z: nextZ, y: nextY, r: r, type: type };
      STAGES.push(stageInfo);
      
      const islandMeshGroup = createIslandMesh(r, nextY, nextZ);
      scene.add(islandMeshGroup);
      stageMeshes.push({ meshGroup: islandMeshGroup, stageIdx: idx });
      
      CONNECTIONS.push({ from: idx - 1, to: idx, type: type });
      createBridgeLinks(idx - 1, idx, prev.z, nextZ, prev.r, r, prev.y, nextY, type);

      if (idx >= 1) {
        spawnGatesOnIsland(idx, nextZ, nextY);

        speedItemIslandCounter++;
        let shouldSpawnItem = false;

        if (idx === 1) {
          shouldSpawnItem = true;
          speedItemIslandCounter = 0;
        } else if (speedItemIslandCounter >= 3) {
          shouldSpawnItem = true;
          speedItemIslandCounter = 0;
        } else if (speedItemIslandCounter >= 2) {
          if (Math.random() < 0.65) {
            shouldSpawnItem = true;
            speedItemIslandCounter = 0;
          }
        }

        if (shouldSpawnItem) {
          const typeToSpawn = ITEM_ROTATION[itemRotationIndex % ITEM_ROTATION.length];
          itemRotationIndex++;
          spawnItem(idx, typeToSpawn);
        }
      }

      if (idx % 2 === 0) {
        const cloudSide = (idx % 4 === 0) ? 1 : -1;
        const cloudMesh = createCloudMesh();
        const cloudX = cloudSide * (16 + Math.random() * 8);
        const cloudY = (prev.y + nextY) / 2 + (Math.random() * 4 - 2);
        const cloudZ = (prev.z + nextZ) / 2;
        cloudMesh.position.set(cloudX, cloudY, cloudZ);
        scene.add(cloudMesh);
        cloudObjects.push({ mesh: cloudMesh, stageIdx: idx, baseY: cloudY, offset: Math.random() * 10 });
      }

      const isletSides = [-1, 1];
      isletSides.forEach(side => {
        if (Math.random() < 0.65) {
          const isletMesh = createOceanIsletMesh(
            0.8 + Math.random() * 0.7,
            Math.random() < 0.6 ? 'tropical' : 'rocky'
          );
          const isletX = side * (26 + Math.random() * 16);
          const isletZ = nextZ + (Math.random() * 14 - 7);
          isletMesh.position.set(isletX, -42, isletZ);
          scene.add(isletMesh);
          oceanIslands.push({ meshGroup: isletMesh, stageIdx: idx });
        }
      });
    }

    function spawnGatesOnIsland(stageIdx, islandZ, islandY) {
      if (stageIdx % 2 !== 1) return;

      const gateZ = islandZ - 2.8;
      const playerCount = player ? player.stackCount : 0;
      let p;

      if (playerCount >= 51) {
        const cautionPatterns = [
          { left: { op: 'add', val: 4, label: '+4' }, right: { op: 'divide', val: 2, label: '÷2' } },
          { left: { op: 'divide', val: 2, label: '÷2' }, right: { op: 'add', val: 6, label: '+6' } },
          { left: { op: 'subtract', val: 6, label: '-6' }, right: { op: 'add', val: 4, label: '+4' } },
          { left: { op: 'add', val: 6, label: '+6' }, right: { op: 'subtract', val: 8, label: '-8' } },
          { left: { op: 'divide', val: 2, label: '÷2' }, right: { op: 'subtract', val: 4, label: '-4' } }
        ];
        p = cautionPatterns[Math.floor(Math.random() * cautionPatterns.length)];
      } else if (playerCount >= 26) {
        if (Math.random() < 0.15) {
          if (Math.random() < 0.5) {
            p = { left: { op: 'multiply', val: 2, label: '×2' }, right: { op: 'divide', val: 2, label: '÷2' } };
          } else {
            p = { left: { op: 'divide', val: 2, label: '÷2' }, right: { op: 'multiply', val: 2, label: '×2' } };
          }
        } else {
          const stablePatterns = [
            { left: { op: 'add', val: 6, label: '+6' }, right: { op: 'subtract', val: 4, label: '-4' } },
            { left: { op: 'subtract', val: 6, label: '-6' }, right: { op: 'add', val: 6, label: '+6' } },
            { left: { op: 'add', val: 4, label: '+4' }, right: { op: 'subtract', val: 4, label: '-4' } },
            { left: { op: 'add', val: 6, label: '+6' }, right: { op: 'add', val: 4, label: '+4' } }
          ];
          p = stablePatterns[Math.floor(Math.random() * stablePatterns.length)];
        }
      } else {
        if (Math.random() < 0.05) {
          if (Math.random() < 0.5) {
            p = { left: { op: 'multiply', val: 2, label: '×2' }, right: { op: 'subtract', val: 4, label: '-4' } };
          } else {
            p = { left: { op: 'add', val: 4, label: '+4' }, right: { op: 'multiply', val: 2, label: '×2' } };
          }
        } else {
          const boostPatterns = [
            { left: { op: 'add', val: 6, label: '+6' }, right: { op: 'add', val: 4, label: '+4' } },
            { left: { op: 'add', val: 8, label: '+8' }, right: { op: 'subtract', val: 4, label: '-4' } },
            { left: { op: 'subtract', val: 4, label: '-4' }, right: { op: 'add', val: 6, label: '+6' } },
            { left: { op: 'add', val: 4, label: '+4' }, right: { op: 'subtract', val: 2, label: '-2' } }
          ];
          p = boostPatterns[Math.floor(Math.random() * boostPatterns.length)];
        }
      }

      createModifierGate(stageIdx, -3.2, gateZ, islandY, p.left.op, p.left.val, p.left.label);
      createModifierGate(stageIdx, 3.2, gateZ, islandY, p.right.op, p.right.val, p.right.label);
    }

    const dummyPlankObj = new THREE.Object3D();

    function createBridgeLinks(stageIdx, nextStageIdx, prevIslandZ, nextIslandZ, prevR, nextR, startY, endY, type) {
      if (type === 'zipline') {
        const startZ = prevIslandZ - prevR + 1.2;
        const endZ = nextIslandZ + nextR - 1.2;

        const departureTopY = startY + 5.5;
        const arrivalTopY = endY + 4.5;

        const depPylon = createZiplinePylonMesh(0, startY, startZ, departureTopY, true);
        scene.add(depPylon);

        const arrPylon = createZiplinePylonMesh(0, endY, endZ, arrivalTopY, false);
        scene.add(arrPylon);

        const startPt = new THREE.Vector3(0, departureTopY - 0.2, startZ);
        const endPt = new THREE.Vector3(0, arrivalTopY - 0.2, endZ);
        const cableVec = new THREE.Vector3().subVectors(endPt, startPt);
        const cableLen = cableVec.length();

        const cableGeo = new THREE.CylinderGeometry(0.042, 0.042, cableLen, 8);
        const cableMesh = new THREE.Mesh(cableGeo, sharedMats.ziplineCable);
        
        const midPt = new THREE.Vector3().addVectors(startPt, endPt).multiplyScalar(0.5);
        cableMesh.position.copy(midPt);
        cableMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), cableVec.clone().normalize());
        scene.add(cableMesh);

        const stationTrolley = createZiplineTrolleyMesh();
        stationTrolley.position.copy(startPt);
        scene.add(stationTrolley);

        const ziplineBridge = {
          stageIdx, nextStageIdx, laneIdx: 1, planks: [],
          visualMeshes: [depPylon, arrPylon, cableMesh, stationTrolley],
          startZ, endZ, startPt, endPt, cableLen,
          isJump: false, isSlide: false, isVertical: false, isCurvedSlide: false,
          isZipline: true,
          bonusBlocks: []
        };

        const numZiplineBlocks = 6;
        for (let zi = 0; zi < numZiplineBlocks; zi++) {
          const t = 0.20 + (zi / (numZiplineBlocks - 1)) * 0.62;
          const bPos = new THREE.Vector3().lerpVectors(startPt, endPt, t);
          bPos.y -= 1.80;
          bPos.x += Math.sin(zi * 2.2) * 0.35;

          const bMesh = new THREE.Mesh(blockGeometry, sharedMats.blockNeutral);
          bMesh.position.copy(bPos);
          scene.add(bMesh);

          const bonusData = {
            mesh: bMesh,
            t: t,
            baseY: bPos.y,
            zi: zi,
            collected: false,
            stageIdx: stageIdx
          };
          ziplineBridge.bonusBlocks.push(bonusData);
          ziplineBonusBlocks.push(bonusData);
        }

        bridges.push(ziplineBridge);
        return;
      }

      if (type === 'curved_slide') {
        const startZ = prevIslandZ - prevR + 1.2;
        const endZ = nextIslandZ + nextR - 1.2;
        const distZ = startZ - endZ;
        const dropY = startY - endY;
        const sDir = (stageIdx % 2 === 0 ? 1 : -1);

        const p0 = new THREE.Vector3(0, startY + 0.15, startZ);
        const p1 = new THREE.Vector3(sDir * 7.5, startY - dropY * 0.28, startZ - distZ * 0.28);
        const p2 = new THREE.Vector3(-sDir * 5.8, startY - dropY * 0.72, startZ - distZ * 0.72);
        const p3 = new THREE.Vector3(0, endY + 0.15, endZ);
        const spline = new THREE.CatmullRomCurve3([p0, p1, p2, p3]);

        const steps = 55;
        const points = spline.getPoints(steps);
        const curveLength = spline.getLength();

        const posArr = [];
        const normArr = [];
        const idxArr = [];
        const leftRailPts = [];
        const rightRailPts = [];

        const profile = [
          { x: -2.4, y: 0.85 },
          { x: -2.0, y: 0.0 },
          { x: 2.0, y: 0.0 },
          { x: 2.4, y: 0.85 }
        ];

        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const center = points[i];
          const tangent = spline.getTangent(t).normalize();
          const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

          profile.forEach(p => {
            const vx = center.x + normal.x * p.x;
            const vy = center.y + p.y;
            const vz = center.z + normal.z * p.x;
            posArr.push(vx, vy, vz);
            normArr.push(0, 1, 0);
          });

          leftRailPts.push(new THREE.Vector3(center.x - normal.x * 2.4, center.y + 0.85, center.z - normal.z * 2.4));
          rightRailPts.push(new THREE.Vector3(center.x + normal.x * 2.4, center.y + 0.85, center.z + normal.z * 2.4));
        }

        for (let i = 0; i < steps; i++) {
          for (let j = 0; j < 3; j++) {
            const a = i * 4 + j;
            const b = (i + 1) * 4 + j;
            const c = (i + 1) * 4 + (j + 1);
            const d = i * 4 + (j + 1);
            idxArr.push(a, b, d);
            idxArr.push(b, c, d);
          }
        }

        const troughGeo = new THREE.BufferGeometry();
        troughGeo.setAttribute('position', new THREE.Float32BufferAttribute(posArr, 3));
        troughGeo.setAttribute('normal', new THREE.Float32BufferAttribute(normArr, 3));
        troughGeo.setIndex(idxArr);
        troughGeo.computeVertexNormals();

        const troughMesh = new THREE.Mesh(troughGeo, sharedMats.slideSurface);
        troughMesh.receiveShadow = true;
        scene.add(troughMesh);

        const leftRailCurve = new THREE.CatmullRomCurve3(leftRailPts);
        const rightRailCurve = new THREE.CatmullRomCurve3(rightRailPts);
        const railGeoLeft = new THREE.TubeGeometry(leftRailCurve, 50, 0.16, 8, false);
        const railGeoRight = new THREE.TubeGeometry(rightRailCurve, 50, 0.16, 8, false);

        const leftRailMesh = new THREE.Mesh(railGeoLeft, sharedMats.slideRail);
        const rightRailMesh = new THREE.Mesh(railGeoRight, sharedMats.slideRail);
        scene.add(leftRailMesh);
        scene.add(rightRailMesh);

        const curvedBridge = {
          stageIdx, nextStageIdx, laneIdx: 1, planks: [],
          visualMeshes: [troughMesh, leftRailMesh, rightRailMesh],
          startZ, endZ, isJump: false, isSlide: false, isVertical: false,
          isCurvedSlide: true, isZipline: false, curve: spline, curveLength: curveLength,
          bonusBlocks: []
        };

        const numBonuses = 8;
        for (let bi = 0; bi < numBonuses; bi++) {
          const t = 0.22 + (bi / (numBonuses - 1)) * 0.58;
          const pt = spline.getPointAt(t);
          const tangent = spline.getTangentAt(t).normalize();
          const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

          const offsetVal = Math.sin(bi * 1.55) * 1.1;
          const bPos = pt.clone().addScaledVector(normal, offsetVal);
          bPos.y += 0.42;

          const bMesh = new THREE.Mesh(blockGeometry, sharedMats.blockNeutral);
          bMesh.position.copy(bPos);
          scene.add(bMesh);

          const bonusData = {
            mesh: bMesh,
            t: t,
            offset: offsetVal,
            collected: false,
            stageIdx: stageIdx
          };
          curvedBridge.bonusBlocks.push(bonusData);
          curvedSlideBonusBlocks.push(bonusData);
        }

        bridges.push(curvedBridge);
        return;
      }

      const isJump = (type === 'jump');
      const isSlide = (type === 'slide');
      const isVertical = (type === 'vertical');

      for (let laneIdx = 0; laneIdx < 3; laneIdx++) {
        const laneX = LANES[laneIdx];
        const prevInsetZ = Math.sqrt(Math.max(1, prevR * prevR - laneX * laneX));
        const nextInsetZ = Math.sqrt(Math.max(1, nextR * nextR - laneX * laneX));
        const startZ = prevIslandZ - prevInsetZ + 1.2;
        const endZ = nextIslandZ + nextInsetZ - 1.2;
        const distZ = startZ - endZ;
        
        const dist3D = Math.hypot(distZ, endY - startY);
        const numPlanks = isJump ? 1 : Math.max(12, Math.floor(dist3D / (PLANK_LENGTH * 0.75)));

        const bridge = { 
          stageIdx, nextStageIdx, laneIdx, planks: [], visualMeshes: [], 
          startZ, endZ, isJump, isSlide, isVertical, isCurvedSlide: false, isZipline: false,
          ghostMesh: null, solidMesh: null
        };
        
        if (isSlide) {
          const slopeLength = Math.hypot(distZ, endY - startY) + 2.0;
          const slopeGeo = new THREE.BoxGeometry(3.6, 0.4, slopeLength);
          const slopeMesh = new THREE.Mesh(slopeGeo, sharedMats.slideSurface);
          
          const midZ = (startZ + endZ) / 2;
          const midY = (startY + endY) / 2;
          slopeMesh.position.set(LANES[laneIdx], midY - 0.1, midZ);
          const angleX = Math.atan2(endY - startY, startZ - endZ);
          slopeMesh.rotation.x = angleX;
          slopeMesh.receiveShadow = true;
          scene.add(slopeMesh);
          bridge.visualMeshes.push(slopeMesh);

          const railGeo = new THREE.CylinderGeometry(0.15, 0.15, slopeLength, 8);
          railGeo.rotateX(Math.PI / 2);
          const leftRail = new THREE.Mesh(railGeo, sharedMats.slideRail);
          leftRail.position.set(LANES[laneIdx] - 1.85, midY + 0.3, midZ);
          leftRail.rotation.x = angleX;
          scene.add(leftRail);
          bridge.visualMeshes.push(leftRail);

          const rightRail = new THREE.Mesh(railGeo, sharedMats.slideRail);
          rightRail.position.set(LANES[laneIdx] + 1.85, midY + 0.3, midZ);
          rightRail.rotation.x = angleX;
          scene.add(rightRail);
          bridge.visualMeshes.push(rightRail);

          for (let i = 0; i < numPlanks; i++) {
            const progress = (i + 0.5) / numPlanks;
            const pZ = startZ - progress * distZ;
            const pY = startY + progress * (endY - startY);
            bridge.planks.push({ teamId: 'slide_free', index: i, y: pY, z: pZ });
          }
        } else if (isJump) {
          let jumpTier = TRAMPOLINE_TIERS.normal;
          if (laneIdx === 0) jumpTier = TRAMPOLINE_TIERS.normal;
          else if (laneIdx === 1) jumpTier = TRAMPOLINE_TIERS.mega;
          else if (laneIdx === 2) jumpTier = TRAMPOLINE_TIERS.high;

          const tramp = createTrampolineMesh(LANES[laneIdx], startY, startZ - 1.8, jumpTier);
          scene.add(tramp.group);
          bridge.visualMeshes.push(tramp.group);
          bridge.planks.push({
            mesh: tramp.group,
            netMesh: tramp.net,
            teamId: 'neutral',
            index: 0,
            y: startY + 0.52,
            z: startZ - 1.8,
            isJumpPad: true,
            jumpTier: jumpTier
          });
        } else {
          const geoToUse = isVertical ? verticalPlankGeo : plankGeo;
          
          const ghostMesh = new THREE.InstancedMesh(geoToUse, sharedMats.ghostPlank, numPlanks);
          ghostMesh.receiveShadow = true;

          const solidMesh = new THREE.InstancedMesh(geoToUse, sharedMats.solidPlank, numPlanks);
          solidMesh.castShadow = true;
          solidMesh.receiveShadow = true;

          for (let i = 0; i < numPlanks; i++) {
            const progress = (i + 0.5) / numPlanks;
            const pZ = startZ - progress * distZ;
            const pY = startY + progress * (endY - startY);

            dummyPlankObj.position.set(LANES[laneIdx], pY, pZ);
            dummyPlankObj.rotation.set(0, 0, 0);
            dummyPlankObj.scale.set(1, 1, 1);
            dummyPlankObj.updateMatrix();
            ghostMesh.setMatrixAt(i, dummyPlankObj.matrix);

            dummyPlankObj.scale.set(0, 0, 0);
            dummyPlankObj.updateMatrix();
            solidMesh.setMatrixAt(i, dummyPlankObj.matrix);
            solidMesh.setColorAt(i, COLOR_NEUTRAL_PLANK);

            bridge.planks.push({ teamId: null, index: i, y: pY, z: pZ });
          }

          ghostMesh.instanceMatrix.needsUpdate = true;
          solidMesh.instanceMatrix.needsUpdate = true;
          if (solidMesh.instanceColor) solidMesh.instanceColor.needsUpdate = true;

          scene.add(ghostMesh);
          scene.add(solidMesh);
          bridge.ghostMesh = ghostMesh;
          bridge.solidMesh = solidMesh;
          bridge.visualMeshes.push(ghostMesh, solidMesh);
        }
        bridges.push(bridge);
      }
    }

    function buildWorld() {
      stageMeshes.forEach(m => {
        disposeHierarchy(m.meshGroup);
        scene.remove(m.meshGroup);
      });
      bridges.forEach(b => {
        b.visualMeshes.forEach(vm => {
          disposeHierarchy(vm);
          scene.remove(vm);
        });
      });
      modifierGates.forEach(g => {
        disposeHierarchy(g.meshGroup);
        scene.remove(g.meshGroup);
      });
      cloudObjects.forEach(c => {
        disposeHierarchy(c.mesh);
        scene.remove(c.mesh);
      });
      oceanIslands.forEach(oi => {
        disposeHierarchy(oi.meshGroup);
        scene.remove(oi.meshGroup);
      });
      if (seaMesh) {
        disposeHierarchy(seaMesh);
        scene.remove(seaMesh);
      }
      curvedSlideBonusBlocks.forEach(b => {
        if (b.mesh) {
          disposeHierarchy(b.mesh);
          scene.remove(b.mesh);
        }
      });
      ziplineBonusBlocks.forEach(b => {
        if (b.mesh) {
          disposeHierarchy(b.mesh);
          scene.remove(b.mesh);
        }
      });
      floorItems.forEach(item => {
        if (item.group) {
          disposeHierarchy(item.group);
          scene.remove(item.group);
        }
      });
      activeMagnetBlocks.forEach(mb => {
        if (mb.mesh) scene.remove(mb.mesh);
      });
      resetParticlePools();

      activeMagnetBlocks = [];
      magnetDockStepCounter = 0;
      attackCamTimer = 0;
      floorItems = [];
      modifierGates = [];
      bridges = [];
      stageMeshes = [];
      cloudObjects = [];
      oceanIslands = [];
      curvedSlideBonusBlocks = [];
      ziplineBonusBlocks = [];
      speedItemIslandCounter = 0;
      itemRotationIndex = 0;
      STAGES = [{ z: 0, y: 0, r: 12 }];

      scene.background = new THREE.Color(0x7dd3fc);
      scene.fog = new THREE.FogExp2(0x7dd3fc, 0.0032);

      const seaGeo = new THREE.PlaneGeometry(1600, 2400);
      seaMesh = new THREE.Mesh(seaGeo, sharedMats.sea);
      seaMesh.rotation.x = -Math.PI / 2;
      seaMesh.position.set(0, -42, -500);
      seaMesh.receiveShadow = false;
      scene.add(seaMesh);

      const initialIslets = [
        { x: -30, z: -15, scale: 1.2, type: 'tropical' },
        { x: 32, z: 10, scale: 1.0, type: 'rocky' },
        { x: -28, z: 25, scale: 0.9, type: 'tropical' },
        { x: 34, z: -35, scale: 1.3, type: 'tropical' }
      ];
      initialIslets.forEach(cfg => {
        const islet = createOceanIsletMesh(cfg.scale, cfg.type);
        islet.position.set(cfg.x, -42, cfg.z);
        scene.add(islet);
        oceanIslands.push({ meshGroup: islet, stageIdx: 0 });
      });

      const startIslandGroup = createIslandMesh(12, 0, 0);
      scene.add(startIslandGroup);
      stageMeshes.push({ meshGroup: startIslandGroup, stageIdx: 0 });

      for (let i = 0; i < 6; i++) extendCourse();
    }

    function cleanupOldData() {
      if (!player) return;
      const safeStage = Math.max(0, player.currentStage - 3);
      
      for (let i = stageMeshes.length - 1; i >= 0; i--) {
        if (stageMeshes[i].stageIdx < safeStage) {
          disposeHierarchy(stageMeshes[i].meshGroup);
          scene.remove(stageMeshes[i].meshGroup);
          stageMeshes.splice(i, 1);
        }
      }
      for (let i = bridges.length - 1; i >= 0; i--) {
        if (bridges[i].stageIdx < safeStage) {
          bridges[i].visualMeshes.forEach(vm => {
            disposeHierarchy(vm);
            scene.remove(vm);
          });
          bridges.splice(i, 1);
        }
      }
      for (let i = CONNECTIONS.length - 1; i >= 0; i--) {
        if (CONNECTIONS[i].to < safeStage) {
          CONNECTIONS.splice(i, 1);
        }
      }
      floorBlocksByStage.forEach((bucket, stageKey) => {
        if (stageKey < safeStage) {
          bucket.forEach(b => {
            disposeHierarchy(b.mesh);
            scene.remove(b.mesh);
          });
          floorBlocksByStage.delete(stageKey);
        }
      });
      for (let i = floorItems.length - 1; i >= 0; i--) {
        if (floorItems[i].stageIdx < safeStage) {
          if (floorItems[i].group) {
            disposeHierarchy(floorItems[i].group);
            scene.remove(floorItems[i].group);
          }
          floorItems.splice(i, 1);
        }

    function spawnSingleBlock(stageIdx, targetTeam = null) {
      const stageInfo = STAGES[stageIdx];
      if (!stageInfo) return;

      const minClearanceSq = 1.35 * 1.35;
      let validPos = null;
      let attempts = 0;
      const stageBlocks = getFloorBlocksForStage(stageIdx);

      while (attempts < 20) {
        const r = Math.sqrt(Math.random()) * (stageInfo.r - 2.2);
        const theta = Math.random() * Math.PI * 2;
        const candX = Math.cos(theta) * r;
        const candZ = stageInfo.z + Math.sin(theta) * r;

        let isOverlapping = false;
        for (let i = 0; i < stageBlocks.length; i++) {
          const b = stageBlocks[i];
          if (b.active) {
            const dx = b.pos.x - candX;
            const dz = b.pos.z - candZ;
            if (dx * dx + dz * dz < minClearanceSq) {
              isOverlapping = true;
              break;
            }
          }
        }

        if (!isOverlapping) {
          validPos = { x: candX, z: candZ };
          break;
        }
        attempts++;
      }

      if (!validPos) return;

      const team = targetTeam || BLOCK_TYPES[Math.floor(Math.random() * BLOCK_TYPES.length)];
      let mat;
      if (team.id === 'blue') mat = sharedMats.blockBlue;
      else if (team.id === 'red') mat = sharedMats.blockRed;
      else if (team.id === 'yellow') mat = sharedMats.blockYellow;
      else mat = sharedMats.blockNeutral;

      const mesh = new THREE.Mesh(blockGeometry, mat);
      mesh.position.set(validPos.x, stageInfo.y + 0.25, validPos.z);
      mesh.rotation.y = Math.random() * Math.PI;
      scene.add(mesh);

      stageBlocks.push({ mesh, team, pos: mesh.position, active: true, stageIdx });
    }

    function manageBlockSpawns() {
      if (isGameOver) return;
      
      for (let cIdx = 0; cIdx < characters.length; cIdx++) {
        const s = characters[cIdx].currentStage;
        
        let alreadyChecked = false;
        for (let prevIdx = 0; prevIdx < cIdx; prevIdx++) {
          if (characters[prevIdx].currentStage === s) {
            alreadyChecked = true;
            break;
          }
        }
        if (alreadyChecked) continue;

        const stageBlocks = getFloorBlocksForStage(s);

        for (let tIdx = 0; tIdx < BLOCK_TYPES.length; tIdx++) {
          const team = BLOCK_TYPES[tIdx];
          const targetCount = (team.id === 'blue') ? 13 : 7;
          
          let currentCount = 0;
          for (let bIdx = 0; bIdx < stageBlocks.length; bIdx++) {
            const b = stageBlocks[bIdx];
            if (b.active && b.team.id === team.id) {
              currentCount++;
            }
          }

          if (currentCount < targetCount) {
            spawnSingleBlock(s, team);
          }
        }
      }
    }

    function getBrickMaterialForStackIndex(char, index) {
      if (!char.isPlayer) {
        if (char.team.id === 'red') return sharedMats.blockRed;

        return sharedMats.blockNeutral;
      }
      return playerStackMaterials[Math.min(index, MAX_VISUAL_STACK - 1)];

    function refreshCharacterStackVisuals(char) {

      const pool = char.meshObj.stackPool;
      const visibleLimit = Math.min(char.stackCount, MAX_VISUAL_STACK);

      for (let i = 0; i < MAX_VISUAL_STACK; i++) {

    function addBrickToCharacter(char, team, count = 1) {

    function removeBrickFromCharacter(char) {
      if (char.stackCount <= 0) return null;
      char.stackCount--;
      refreshCharacterStackVisuals(char);
      if (char.isPlayer) updateHUD();
      return true;
    }

    function scatterBricks(char, countToDrop) {
      const count = Math.min(char.stackCount, countToDrop);
      const stage = STAGES[char.currentStage] || STAGES[0];
      const floorY = stage.y + 0.25;
      const maxR = stage.r - 1.0;
      const stageBlocks = getFloorBlocksForStage(char.currentStage);

      for (let i = 0; i < count; i++) {
        removeBrickFromCharacter(char);

        const angle = i * 2.39996 + Math.random() * 0.35;
        const dist = 1.6 + Math.sqrt(i + 1) * 0.85;
        let dropX = char.pos.x + Math.cos(angle) * dist;
        let dropZ = char.pos.z + Math.sin(angle) * dist;

        const distFromCenter = Math.hypot(dropX, dropZ - stage.z);
        if (distFromCenter > maxR && distFromCenter > 0.001) {
          dropX = (dropX / distFromCenter) * maxR;
          dropZ = stage.z + ((dropZ - stage.z) / distFromCenter) * maxR;
        }

        const dropMesh = new THREE.Mesh(blockGeometry, sharedMats.blockNeutral);
        dropMesh.position.set(dropX, floorY, dropZ);
        dropMesh.rotation.y = Math.random() * Math.PI;
        scene.add(dropMesh);

        stageBlocks.push({
          mesh: dropMesh, team: TEAMS.NEUTRAL, pos: dropMesh.position,
          active: true, stageIdx: char.currentStage
        });
      }
    }

    function checkGateCollisions(char) {
      if (!char.isPlayer) return;

      for (let i = 0; i < modifierGates.length; i++) {
        const gate = modifierGates[i];
        if (gate.consumed || gate.stageIdx !== char.currentStage) continue;

        const dx = Math.abs(char.pos.x - gate.pos.x);
        const dz = Math.abs(char.pos.z - gate.pos.z);
        if (dx < 1.4 && dz < 0.9) {
          gate.consumed = true;
          disposeHierarchy(gate.meshGroup);
          scene.remove(gate.meshGroup);

          if (gate.opType === 'multiply') {
            const currentCount = char.stackCount;
            const targetCount = currentCount * gate.value;
            const addCount = targetCount - currentCount;
            if (addCount > 0) {
              addBrickToCharacter(char, char.team, addCount);
              sound.playGateBoost();
            }
          } else if (gate.opType === 'divide') {
            const currentCount = char.stackCount;
            const targetCount = Math.floor(currentCount / gate.value);
            const dropCount = currentCount - targetCount;
            if (dropCount > 0) {
              scatterBricks(char, dropCount);
              sound.playTackle();
            }
          } else if (gate.opType === 'add') {
            addBrickToCharacter(char, char.team, gate.value);
            sound.playGateBoost();
          } else if (gate.opType === 'subtract') {
            scatterBricks(char, gate.value);
            sound.playTackle();
          }
          break;
        }
      }
    }

              const dx = char.pos.x - blk.pos.x;
              const dz = char.pos.z - blk.pos.z;
