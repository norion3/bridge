      const b2Mesh = createCharacterMesh(TEAMS.YELLOW);
      scene.add(b2Mesh.root);
      characters.push({
        isPlayer: false, team: TEAMS.YELLOW, meshObj: b2Mesh,
        pos: new THREE.Vector3(4.0, STAGES[0].y, STAGES[0].z + 4),
        rotation: 0, stackCount: 0, stackBricks: [], currentStage: 0,
        aiState: 'COLLECT', aiCapacityGoal: 12, stunTimer: 0, invulnerableTimer: 0, walkCycle: 0,
        isJumping: false, onSlide: false, onCurvedSlide: false, curvedSlideProgress: 0, curvedSlideOffset: 0, slideCooldown: 0,
        onZipline: false, ziplineProgress: 0, activeZipline: null,
        jumpProgress: 0, lastPlankIdx: -1, botSlideOffsetTarget: 0,
        speedBoostActive: false, speedBoostUntilStage: -1, puffTimer: 0
      });
    }

    function spawnSingleBlock(stageIdx, targetTeam = null) {
      const stageInfo = STAGES[stageIdx];
      if (!stageInfo) return;

      const minClearance = 1.35;
      const minClearanceSq = minClearance * minClearance;

      let validPos = null;
      let attempts = 0;
      while (attempts < 20) {
        const r = Math.sqrt(Math.random()) * (stageInfo.r - 2.2);
        const theta = Math.random() * Math.PI * 2;
        const candX = Math.cos(theta) * r;
        const candZ = stageInfo.z + Math.sin(theta) * r;

        let isOverlapping = false;
        for (let i = 0; i < floorBlocks.length; i++) {
          const b = floorBlocks[i];
          if (b.active && b.stageIdx === stageIdx) {
            const dx = b.pos.x - candX;
            const dz = b.pos.z - candZ;
            if (dx * dx + dz * dz < minClearanceSq) {
              isOverlapping = true;
              break;
            }
          }
        }

        if (!isOverlapping) {
          validPos = { x: candX, z: candZ };
          break;
        }
        attempts++;
      }

      if (!validPos) return;

      const team = targetTeam || BLOCK_TYPES[Math.floor(Math.random() * BLOCK_TYPES.length)];
      let mat;
      if (team.id === 'blue') mat = sharedMats.blockBlue;
      else if (team.id === 'red') mat = sharedMats.blockRed;
      else if (team.id === 'yellow') mat = sharedMats.blockYellow;
      else mat = sharedMats.blockNeutral;

      const mesh = new THREE.Mesh(blockGeometry, mat);
      mesh.castShadow = true;
      mesh.position.set(validPos.x, stageInfo.y + 0.25, validPos.z);
      mesh.rotation.y = Math.random() * Math.PI;
      scene.add(mesh);

      floorBlocks.push({ mesh, team, pos: mesh.position, active: true, stageIdx });
    }

    function manageBlockSpawns() {
      if (isGameOver) return;
      const activeStages = new Set(characters.map(c => c.currentStage));
      activeStages.forEach(s => {
        BLOCK_TYPES.forEach(team => {
          const targetCount = (team.id === 'blue') ? 13 : 7;
          const currentCount = floorBlocks.filter(b => b.active && b.stageIdx === s && b.team.id === team.id).length;
          if (currentCount < targetCount) spawnSingleBlock(s, team);
        });
      });
    }

    function getBrickMaterialForStackIndex(char, index) {
      if (!char.isPlayer) {
        if (char.team.id === 'red') return sharedMats.blockRed;
        if (char.team.id === 'yellow') return sharedMats.blockYellow;
        return sharedMats.blockNeutral;
      }
      return playerStackMaterials[Math.min(index, MAX_VISUAL_STACK - 1)];
    }

    function refreshCharacterStackVisuals(char) {
      if (char.isPlayer) {
        updatePlayerStackMaterials(char.stackCount);
      }
      for (let i = 0; i < char.stackBricks.length; i++) {
        char.stackBricks[i].material = getBrickMaterialForStackIndex(char, i);
      }
    }

    function addBrickToCharacter(char, team, count = 1) {
      for (let i = 0; i < count; i++) {
        char.stackCount++;
        
        if (char.stackBricks.length < MAX_VISUAL_STACK) {
          const idx = char.stackBricks.length;
          const mat = getBrickMaterialForStackIndex(char, idx);
          const brickMesh = new THREE.Mesh(blockGeometry, mat);
          brickMesh.castShadow = true;
          
          const stackHeight = idx * 0.44;
          const xOffset = (idx % 2 === 0) ? -0.015 : 0.015;
          brickMesh.position.set(xOffset, stackHeight, 0);
          
          char.meshObj.stackGroup.add(brickMesh);
          char.stackBricks.push(brickMesh);
        }
      }
      refreshCharacterStackVisuals(char);
      if (char.isPlayer) {
        sound.playCollect(1 + Math.min(char.stackCount * 0.015, 0.8));
        updateHUD();
      }
    }

    function removeBrickFromCharacter(char) {
      if (char.stackCount <= 0) return null;
      char.stackCount--;
      if (char.stackBricks.length > Math.min(char.stackCount, MAX_VISUAL_STACK)) {
        const brickMesh = char.stackBricks.pop();
        if (brickMesh) char.meshObj.stackGroup.remove(brickMesh);
      }
      refreshCharacterStackVisuals(char);
      if (char.isPlayer) updateHUD();
      return true;
    }

    function scatterBricks(char, countToDrop) {
      const count = Math.min(char.stackCount, countToDrop);
      const stage = STAGES[char.currentStage] || STAGES[0];
      const floorY = stage.y + 0.25;
      const minClearanceSq = 1.35 * 1.35;

      for (let i = 0; i < count; i++) {
        removeBrickFromCharacter(char);

        let dropX = char.pos.x;
        let dropZ = char.pos.z;

        for (let attempt = 0; attempt < 18; attempt++) {
          const ang = Math.random() * Math.PI * 2;
          const dist = 1.6 + Math.random() * 3.8;
          const candX = char.pos.x + Math.cos(ang) * dist;
          const candZ = char.pos.z + Math.sin(ang) * dist;

          if (Math.hypot(candX, candZ - stage.z) > stage.r - 1.2) continue;

          let overlap = false;
          for (let j = 0; j < floorBlocks.length; j++) {
            const b = floorBlocks[j];
            if (b.active && b.stageIdx === char.currentStage) {
              const dx = b.pos.x - candX;
              const dz = b.pos.z - candZ;
              if (dx * dx + dz * dz < minClearanceSq) {
                overlap = true;
                break;
              }
            }
          }

          if (!overlap) {
            dropX = candX;
            dropZ = candZ;
            break;
          }
        }

        const dropMesh = new THREE.Mesh(blockGeometry, sharedMats.blockNeutral);
        dropMesh.position.set(dropX, floorY, dropZ);
        dropMesh.rotation.y = Math.random() * Math.PI;
        dropMesh.castShadow = true;
        scene.add(dropMesh);

        floorBlocks.push({
          mesh: dropMesh, team: TEAMS.NEUTRAL, pos: dropMesh.position,
          active: true, stageIdx: char.currentStage
        });
      }
    }

    function checkGateCollisions(char) {
      if (!char.isPlayer) return;

      for (let i = 0; i < modifierGates.length; i++) {
        const gate = modifierGates[i];
        if (gate.consumed || gate.stageIdx !== char.currentStage) continue;

        const dx = Math.abs(char.pos.x - gate.pos.x);
        const dz = Math.abs(char.pos.z - gate.pos.z);
        if (dx < 1.4 && dz < 0.9) {
          gate.consumed = true;
          scene.remove(gate.meshGroup);

          if (gate.opType === 'multiply') {
            const currentCount = char.stackCount;
            const targetCount = currentCount * gate.value;
            const addCount = targetCount - currentCount;
            if (addCount > 0) {
              addBrickToCharacter(char, char.team, addCount);
              sound.playGateBoost();
            }
          } else if (gate.opType === 'divide') {
            const currentCount = char.stackCount;
            const targetCount = Math.floor(currentCount / gate.value);
            const dropCount = currentCount - targetCount;
            if (dropCount > 0) {
              scatterBricks(char, dropCount);
              sound.playTackle();
            }
          } else if (gate.opType === 'add') {
            addBrickToCharacter(char, char.team, gate.value);
            sound.playGateBoost();
          } else if (gate.opType === 'subtract') {
            scatterBricks(char, gate.value);
            sound.playTackle();
          }
          break;
        }
      }
    }

    function updateCharacters(dt) {
      let moveDirX = input.active ? input.x : 0;
      let moveDirZ = input.active ? input.y : 0;

      updateSingleCharacter(player, moveDirX, moveDirZ, dt);
      characters.forEach(c => { if (!c.isPlayer) updateAICharacter(c, dt); });
      handleTackles();
    }

    function updateSingleCharacter(char, dirX, dirZ, dt) {
      if (char.invulnerableTimer > 0) {
        char.invulnerableTimer -= dt;
        char.meshObj.root.visible = (Math.floor(Date.now() / 90) % 2 === 0);
      } else {
        char.meshObj.root.visible = true;
      }

      if (char.slideCooldown > 0) {
        char.slideCooldown -= dt;
      }

      // スピードUP持続管理（1島走破＋次の島へ着地した瞬間に解除）
      if (char.speedBoostActive && char.currentStage >= char.speedBoostUntilStage) {
        char.speedBoostActive = false;
        if (char.meshObj.footAura) char.meshObj.footAura.visible = false;
      }

      if (char.isJumping) {
        char.jumpProgress += dt * 1.4;
        if (char.jumpProgress >= 1) {
          char.isJumping = false;
          char.currentStage = char.jumpTargetStage;
          char.pos.x = char.jumpTargetX;
          char.pos.z = STAGES[char.currentStage].z + STAGES[char.currentStage].r * 0.4;
          char.pos.y = STAGES[char.currentStage].y;
          char.lastPlankIdx = -1;
          if (char.isPlayer) sound.playBuildPlank();
        } else {
          const t = char.jumpProgress;
          char.pos.x = THREE.MathUtils.lerp(char.jumpStartX, char.jumpTargetX, t);
          char.pos.z = THREE.MathUtils.lerp(char.jumpStartZ, STAGES[char.jumpTargetStage].z, t);
          const jumpHeight = 10;
          char.pos.y = THREE.MathUtils.lerp(char.jumpStartY, STAGES[char.jumpTargetStage].y, t) + Math.sin(t * Math.PI) * jumpHeight;
          char.meshObj.root.rotation.x = Math.sin(t * Math.PI) * Math.PI * -2;
        }
        char.meshObj.root.position.copy(char.pos);
        return;
      }

      if (char.stunTimer > 0) {
        char.stunTimer -= dt;
        char.meshObj.root.rotation.z = Math.sin(Date.now() * 0.02) * 0.4;
        char.meshObj.root.rotation.x = 0;
        return;
      }
      char.meshObj.root.rotation.z = 0;

      // ジップライン滑空＆着地処理
      if (char.onZipline && char.activeZipline) {
        const zip = char.activeZipline;
        const totalFlyTime = 3.25;
        char.ziplineProgress += dt / totalFlyTime;

        char.meshObj.stackGroup.scale.set(0.45, 0.45, 0.45);
        char.meshObj.stackGroup.position.set(0, 0.45, -0.42);

        if (char.meshObj.trolleyGroup) {
          char.meshObj.trolleyGroup.visible = true;
        }

        if (zip.bonusBlocks && zip.bonusBlocks.length > 0) {
          for (let bi = 0; bi < zip.bonusBlocks.length; bi++) {
            const blk = zip.bonusBlocks[bi];
            if (!blk.collected) {
              if (Math.abs(blk.t - char.ziplineProgress) < 0.048) {
                blk.collected = true;
                scene.remove(blk.mesh);
                addBrickToCharacter(char, char.team, 1);
                if (char.isPlayer) {
                  sound.playCollect(1.25 + blk.t * 0.65);
                }
              }
            }
          }
        }

        if (char.ziplineProgress >= 1.0) {
          char.onZipline = false;
          char.currentStage = zip.nextStageIdx;
          const nextStageObj = STAGES[zip.nextStageIdx];
          
          const landZ = nextStageObj.z + nextStageObj.r * 0.45;
          char.pos.set(char.pos.x * 0.3, nextStageObj.y, landZ);
          char.slideCooldown = 0.5;
          char.lastPlankIdx = -1;
          char.activeZipline = null;

          if (char.meshObj.trolleyGroup) {
            char.meshObj.trolleyGroup.visible = false;
          }
          char.meshObj.stackGroup.scale.set(1.0, 1.0, 1.0);
          char.meshObj.stackGroup.position.set(0, 0.65, -0.42);

          char.meshObj.leftArm.position.set(-0.48, 0.68, 0);
          char.meshObj.rightArm.position.set(0.48, 0.68, 0);
          char.meshObj.leftArm.rotation.set(0, 0, 0);
          char.meshObj.rightArm.rotation.set(0, 0, 0);
          char.meshObj.leftLeg.rotation.set(0, 0, 0);
          char.meshObj.rightLeg.rotation.set(0, 0, 0);
          char.meshObj.body.position.y = 0.65;
          char.meshObj.head.position.y = 1.25;

          triggerLandingShockwave(char.pos.x, nextStageObj.y, landZ);
          if (char.isPlayer) {
            sound.playLanding();
          }

          if (!char.isPlayer) {
            char.aiState = 'COLLECT';
            char.targetLane = undefined;
            char.aiCapacityGoal = 8 + Math.floor(Math.random() * 5);
          }
        } else {
          const t = Math.min(0.999, Math.max(0, char.ziplineProgress));
          const cablePt = new THREE.Vector3().lerpVectors(zip.startPt, zip.endPt, t);

          char.pos.set(cablePt.x, cablePt.y - 1.45, cablePt.z);

          const nowSec = performance.now() * 0.001;
          const legKick = Math.sin(nowSec * 24) * 0.75;
          char.meshObj.leftLeg.rotation.x = legKick;
          char.meshObj.rightLeg.rotation.x = -legKick;

          char.meshObj.leftArm.position.set(-0.35, 1.35, 0);
          char.meshObj.rightArm.position.set(0.35, 1.35, 0);
          char.meshObj.leftArm.rotation.set(-Math.PI * 0.72, 0, -0.22);
          char.meshObj.rightArm.rotation.set(-Math.PI * 0.72, 0, 0.22);

          char.meshObj.root.rotation.y = Math.PI;
          char.meshObj.root.rotation.z = Math.sin(nowSec * 9) * 0.14;
          char.meshObj.root.rotation.x = 0.12;

          if (char.isPlayer) {
            sound.playZipline(t);
          }
        }

        char.meshObj.root.position.copy(char.pos);
        return;
      }

      // 立体U字カーブスライダーの乗車物理
      if (char.onCurvedSlide && char.activeCurvedBridge) {
        const b = char.activeCurvedBridge;
        const slideSpeed = 31.0;
        const progressDelta = (slideSpeed * dt) / Math.max(10, b.curveLength);
        char.curvedSlideProgress += progressDelta;

        if (char.curvedSlideProgress >= 1.0) {
          char.onCurvedSlide = false;
          char.currentStage = b.nextStageIdx;
          const nextStageObj = STAGES[b.nextStageIdx];
          char.pos.set(char.curvedSlideOffset * 0.6, nextStageObj.y, nextStageObj.z + nextStageObj.r * 0.4);
          char.slideCooldown = 1.4;
          char.lastPlankIdx = -1;
          char.activeCurvedBridge = null;

          if (!char.isPlayer) {
            char.aiState = 'COLLECT';
            char.targetLane = undefined;
            char.aiCapacityGoal = 8 + Math.floor(Math.random() * 5);
          }
        } else {
          const t = Math.min(0.999, Math.max(0, char.curvedSlideProgress));
          const pt = b.curve.getPointAt(t);
          const tangent = b.curve.getTangentAt(t).normalize();
          const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

          char.curvedSlideOffset = Math.max(-1.6, Math.min(1.6, char.curvedSlideOffset + dirX * 12 * dt));

          char.pos.copy(pt).addScaledVector(normal, char.curvedSlideOffset);
          char.pos.y = pt.y + 0.18;

          if (b.bonusBlocks && b.bonusBlocks.length > 0) {
            for (let bi = 0; bi < b.bonusBlocks.length; bi++) {
              const blk = b.bonusBlocks[bi];
              if (!blk.collected) {
                const progDiff = Math.abs(blk.t - char.curvedSlideProgress);
                const offsetDiff = Math.abs(blk.offset - char.curvedSlideOffset);
                if (progDiff < 0.045 && offsetDiff < 0.95) {
                  blk.collected = true;
                  scene.remove(blk.mesh);
                  addBrickToCharacter(char, char.team, 1);
                  if (char.isPlayer) {
                    sound.playCollect(1.2 + blk.t * 0.6);
                  }
                }
              }
            }
          }

          char.rotation = Math.atan2(tangent.x, tangent.z);
          char.meshObj.root.rotation.y = char.rotation;
          char.meshObj.root.rotation.z = -dirX * 0.35 - (normal.x * 0.2);
          char.meshObj.root.rotation.x = 0.25;

          char.meshObj.leftLeg.rotation.x = -0.35;
          char.meshObj.rightLeg.rotation.x = -0.35;
          char.meshObj.leftArm.rotation.x = -0.65;
          char.meshObj.rightArm.rotation.x = -0.65;
          char.meshObj.body.position.y = 0.50;
          char.meshObj.head.position.y = 1.15;

          if (char.isPlayer) sound.playSlide();
        }

        char.meshObj.root.position.copy(char.pos);
        return;
      }

      // 通常移動（再調整：通常10.5、ブースト時は「13.2」で小回り・拾いやすさを最大化）
      let speed = char.speedBoostActive ? 13.2 : 10.5;

      if (char.onSlide) {
        speed = 28;
        if (char.isPlayer) sound.playSlide();
      }

      let effectiveDirX = dirX;
      let effectiveDirZ = dirZ;
      if (char.onSlide) {
        effectiveDirZ = -1.0;
        effectiveDirX = dirX * 0.8;
      }

      const moveMag = Math.hypot(effectiveDirX, effectiveDirZ);
      if (moveMag > 0.08 || char.onSlide) {
        // 旋回レスポンス：ブースト中は通常0.22から0.36へ引き上げクイック追従
        const turnLerp = (char.speedBoostActive && !char.onSlide) ? 0.36 : 0.22;
        char.rotation = THREE.MathUtils.lerp(char.rotation, Math.atan2(effectiveDirX, effectiveDirZ), turnLerp);
        char.meshObj.root.rotation.y = char.rotation;

        const nextX = char.pos.x + effectiveDirX * speed * dt;
        const nextZ = char.pos.z + effectiveDirZ * speed * dt;

        handleCourseMovement(char, nextX, nextZ, effectiveDirX, effectiveDirZ);

        // スピードUP中は足のピッチも早くなりダッシュ感を強調
        const walkCycleSpeed = (char.onSlide ? 0 : 16) * (char.speedBoostActive ? 1.55 : 1.0);
        char.walkCycle += dt * walkCycleSpeed; 
        
        if (char.onSlide) {
          char.meshObj.leftLeg.rotation.x = -0.3;
          char.meshObj.rightLeg.rotation.x = -0.3;
          char.meshObj.leftArm.rotation.x = -0.6;
          char.meshObj.rightArm.rotation.x = -0.6;
          char.meshObj.body.position.y = 0.50;
          char.meshObj.head.position.y = 1.15;
          char.meshObj.root.rotation.x = 0.22;
          char.meshObj.root.rotation.z = -effectiveDirX * 0.35;
        } else {
          const swing = Math.sin(char.walkCycle) * 0.75;
          char.meshObj.leftLeg.rotation.x = swing;
          char.meshObj.rightLeg.rotation.x = -swing;
          char.meshObj.leftArm.rotation.x = -swing;
          char.meshObj.rightArm.rotation.x = swing;
          
          const bounce = Math.abs(Math.sin(char.walkCycle * 2)) * 0.12; 
          char.meshObj.body.position.y = 0.65 + bounce;
          char.meshObj.head.position.y = 1.25 + bounce;

          // スピードUP中はスポーティな前傾姿勢
          char.meshObj.root.rotation.x = char.speedBoostActive ? 0.20 : 0;
          char.meshObj.root.rotation.z = 0;
        }
        char.meshObj.stackGroup.rotation.z = Math.sin(char.walkCycle) * 0.05;

        // スピードUP演出：走行中のみ足元後方から「ミニ砂煙（ちぎれ雲）」＋「ゴールドステップ波紋」を放出
        if (char.speedBoostActive && !char.onSlide) {
          char.puffTimer = (char.puffTimer || 0) + dt;
          if (char.puffTimer > 0.085) {
            char.puffTimer = 0;
            const backDist = 0.45;
            const puffX = char.pos.x - Math.sin(char.rotation) * backDist;
            const puffZ = char.pos.z - Math.cos(char.rotation) * backDist;
            spawnPuffCloud(puffX, char.pos.y, puffZ);
            spawnSpeedStepRing(char.pos.x, char.pos.y, char.pos.z);
          }
        }
      } else {
        char.meshObj.leftLeg.rotation.x = THREE.MathUtils.lerp(char.meshObj.leftLeg.rotation.x, 0, 0.2);
        char.meshObj.rightLeg.rotation.x = THREE.MathUtils.lerp(char.meshObj.rightLeg.rotation.x, 0, 0.2);
        char.meshObj.leftArm.rotation.x = THREE.MathUtils.lerp(char.meshObj.leftArm.rotation.x, 0, 0.2);
        char.meshObj.rightArm.rotation.x = THREE.MathUtils.lerp(char.meshObj.rightArm.rotation.x, 0, 0.2);
        char.meshObj.root.rotation.x = 0;
        char.meshObj.root.rotation.z = 0;
      }

      // 足元オーラリングの脈動更新（ブースト中のみ足元に常時接地表示）
      if (char.meshObj.footAura) {
        if (char.speedBoostActive) {
          char.meshObj.footAura.visible = true;
          const auraPulse = 1.0 + Math.sin(performance.now() * 0.008) * 0.12;
          char.meshObj.footAura.scale.set(auraPulse, auraPulse, auraPulse);
        } else {
          char.meshObj.footAura.visible = false;
        }
      }

      if (!char.onSlide && !char.onCurvedSlide && !char.onZipline) {
        // 通常ブロック回収
        for (let i = floorBlocks.length - 1; i >= 0; i--) {
          const blk = floorBlocks[i];
          if (!blk.active || blk.stageIdx !== char.currentStage) continue;
          if ((blk.team.id === char.team.id || blk.team.id === 'neutral') && Math.abs(char.pos.y - blk.pos.y) < 1.4) {
            if (Math.hypot(char.pos.x - blk.pos.x, char.pos.z - blk.pos.z) < 1.5) {
              blk.active = false;
              scene.remove(blk.mesh);
              floorBlocks.splice(i, 1);
              addBrickToCharacter(char, char.team);
            }
          }
        }

        // アイテム（大粒クリスタル）回収判定
        for (let i = floorItems.length - 1; i >= 0; i--) {
          const item = floorItems[i];
          if (!item.active || item.stageIdx !== char.currentStage) continue;
          if (Math.abs(char.pos.y - item.pos.y) < 2.2 && Math.hypot(char.pos.x - item.pos.x, char.pos.z - item.pos.z) < 1.7) {
            item.active = false;
            if (item.group) scene.remove(item.group);
            floorItems.splice(i, 1);

            if (item.type === 'speed') {
              char.speedBoostActive = true;
              // 1島走破＋次の島へ着地した瞬間に解除（使い切りブースト）
              char.speedBoostUntilStage = char.currentStage + 1;
              if (char.meshObj.footAura) char.meshObj.footAura.visible = true;
              if (char.isPlayer) sound.playItemGet();
            }
          }
        }

        checkGateCollisions(char);
      }

      const currentStageObj = STAGES[char.currentStage];
      const nextStageObj = STAGES[char.currentStage + 1];
      const lowestAllowedY = Math.min(
        currentStageObj ? currentStageObj.y : 0,
        nextStageObj ? nextStageObj.y : 0
      ) - 10.0;

      if (!char.isJumping && !char.onCurvedSlide && !char.onZipline && char.pos.y < lowestAllowedY) {
        if (currentStageObj) {
          char.pos.set(0, currentStageObj.y, currentStageObj.z);
          char.onSlide = false;
          char.invulnerableTimer = 1.0;
        }
      }

      char.meshObj.root.position.copy(char.pos);
    }

    function handleCourseMovement(char, nextX, nextZ, inputDirX, inputDirZ) {
      char.onSlide = false;
      const isMovingDownwardOrBackward = (nextZ >= char.pos.z - 0.001) || (inputDirZ >= -0.05);
      const isForwardIntent = !isMovingDownwardOrBackward && (inputDirZ < -0.05);

      const zipB = bridges.find(b => b.isZipline && b.stageIdx === char.currentStage);
      if (zipB && char.slideCooldown <= 0) {
        const distToStart = Math.hypot(nextX, nextZ - zipB.startZ);
        if (distToStart < 3.2 && isForwardIntent) {
          char.onZipline = true;
          char.ziplineProgress = 0;
          char.activeZipline = zipB;
          return;
        }
      }

      const curvedB = bridges.find(b => b.isCurvedSlide && b.stageIdx === char.currentStage);
      if (curvedB && char.slideCooldown <= 0) {
        const distToStart = Math.hypot(nextX, nextZ - curvedB.startZ);
        if (distToStart < 3.2 && isForwardIntent) {
          char.onCurvedSlide = true;
          char.curvedSlideProgress = 0;
          char.curvedSlideOffset = Math.max(-1.5, Math.min(1.5, nextX));
          char.activeCurvedBridge = curvedB;
          if (!char.isPlayer) {
            char.botSlideOffsetTarget = (Math.random() - 0.5) * 1.5;
          }
          return;
        }
      }

      let onBridge = null;
      for (let b of bridges) {
        if (b.isCurvedSlide || b.isZipline) continue;
        if (nextZ <= b.startZ + 0.8 && nextZ >= b.endZ - 0.8) {
          if (Math.abs(nextX - LANES[b.laneIdx]) < 2.5) {
            onBridge = b;
            break;
          }
        }
      }

      if (onBridge) {
        if (char.pos.z <= onBridge.endZ + 0.2 && isMovingDownwardOrBackward) {
          const isBridgeOpen = onBridge.isSlide || onBridge.planks.every(p => p.teamId !== null);
          if (!isBridgeOpen) {
            char.pos.z = onBridge.endZ - 0.2;
            return;
          }
        }

        if (nextZ <= onBridge.endZ + 0.8) {
          const lastPlank = onBridge.planks[onBridge.planks.length - 1];
          const canPassEnd = onBridge.isSlide || (lastPlank && lastPlank.teamId === char.team.id);
          if (canPassEnd) {
            char.currentStage = onBridge.nextStageIdx;
            if (onBridge.isSlide) {
              const maxR = STAGES[onBridge.nextStageIdx].r - 1.5;
              char.pos.x = Math.max(-maxR, Math.min(maxR, nextX));
            } else {
              char.pos.x = LANES[onBridge.laneIdx];
            }
            char.pos.z = nextZ;
            char.pos.y = STAGES[onBridge.nextStageIdx].y;
            char.lastPlankIdx = -1;
            char.onSlide = false;
            
            if (!char.isPlayer) {
              char.aiState = 'COLLECT';
              char.targetLane = undefined;
              char.aiCapacityGoal = 8 + Math.floor(Math.random() * 5);
            }
            return;
          }
        }

        if (nextZ >= onBridge.startZ) {
          char.currentStage = onBridge.stageIdx;
          char.pos.x = LANES[onBridge.laneIdx];
          char.pos.z = nextZ;
          char.pos.y = STAGES[onBridge.stageIdx].y;
          char.lastPlankIdx = -1;
          char.onSlide = false;
          return;
        }

        const progress = Math.min(Math.max((onBridge.startZ - nextZ) / (onBridge.startZ - onBridge.endZ), 0), 0.999);
        const plankIdx = Math.floor(progress * onBridge.planks.length);
        
        if (plankIdx >= 0 && plankIdx < onBridge.planks.length) {
          const plank = onBridge.planks[plankIdx];
          
          if (plank.isJumpPad) {
            if (isForwardIntent) {
              char.isJumping = true;
              char.jumpProgress = 0;
              char.jumpStartX = char.pos.x; char.jumpStartY = char.pos.y; char.jumpStartZ = char.pos.z;
              char.jumpTargetStage = onBridge.nextStageIdx;
              char.jumpTargetX = LANES[onBridge.laneIdx];
              char.lastPlankIdx = -1;
              
              if (plank.netMesh) {
                plank.netMesh.scale.set(1.1, 0.2, 1.1);
                plank.netMesh.position.y = 0.35;
                setTimeout(() => {
                  if (plank.netMesh) {
                    plank.netMesh.scale.set(1.0, 1.0, 1.0);
                    plank.netMesh.position.y = 0.50;
                  }
                }, 180);
              }
              if (char.isPlayer) sound.playJump();
            }
            return;
          }

          if (onBridge.isSlide) {
            const laneCenterX = LANES[onBridge.laneIdx];
            const maxOffset = 1.35;
            char.pos.x = Math.max(laneCenterX - maxOffset, Math.min(laneCenterX + maxOffset, nextX));
            char.pos.z = nextZ; 
            char.pos.y = plank.y;
            char.onSlide = true;
            char.lastPlankIdx = plankIdx;
            return;
          }

          if (isForwardIntent) {
            const startIdx = (char.lastPlankIdx >= 0 && char.lastPlankIdx <= plankIdx) ? char.lastPlankIdx : plankIdx;
            let blocked = false;

            for (let pIndex = startIdx; pIndex <= plankIdx; pIndex++) {
              const currentP = onBridge.planks[pIndex];
              if (currentP.teamId !== char.team.id) {
                if (char.stackCount > 0) {
                  removeBrickFromCharacter(char);
                  currentP.teamId = char.team.id;

                  if (char.team.id === 'blue') currentP.mesh.material = sharedMats.bluePlank;
                  else if (char.team.id === 'red') currentP.mesh.material = sharedMats.redPlank;
                  else if (char.team.id === 'yellow') currentP.mesh.material = sharedMats.yellowPlank;

                  if (char.isPlayer) {
                    sound.playBuildPlank();
                    placedPlankCount++;
                    updateHUD();
                  }
                } else {
                  blocked = true;
                  const blockedZ = onBridge.startZ - (pIndex / onBridge.planks.length) * (onBridge.startZ - onBridge.endZ);
                  char.pos.x = LANES[onBridge.laneIdx];
                  char.pos.z = blockedZ + 0.2; 
                  char.pos.y = currentP.y;
                  if (!char.isPlayer) {
                    char.aiState = 'COLLECT';
                    char.targetLane = undefined;
                  }
                  break;
                }
              }
            }

            if (!blocked) {
              char.pos.x = LANES[onBridge.laneIdx];
              char.pos.z = nextZ;
              char.pos.y = plank.y;
              char.lastPlankIdx = plankIdx;
            }
          } else {
            char.pos.x = LANES[onBridge.laneIdx];
            char.pos.z = nextZ;
            char.pos.y = plank.y;
            char.lastPlankIdx = plankIdx;
          }
        }
        return;
      }

      let onStage = null;
      for (let i = Math.max(0, char.currentStage - 1); i < STAGES.length; i++) {
        const stage = STAGES[i];
        const dx = nextX;
        const dz = nextZ - stage.z;
        const inCircle = (dx * dx + dz * dz) < ((stage.r + 1.0) * (stage.r + 1.0));
        if (inCircle) {
          onStage = i;
          break;
        }
      }

      if (onStage !== null) {
        char.pos.x = nextX;
        char.pos.z = nextZ;
        char.pos.y = STAGES[onStage].y;
        char.currentStage = onStage;
        char.lastPlankIdx = -1;
        char.onSlide = false;
        return;
      }
    }

    function evaluateBestLaneForBot(bot) {
      const stageBridges = bridges.filter(b => b.stageIdx === bot.currentStage && !b.isJump && !b.isSlide && !b.isCurvedSlide && !b.isZipline);
      if (stageBridges.length === 0) return Math.floor(Math.random() * 3);

      const laneScores = [0, 0, 0];
      stageBridges.forEach(b => {
        const lane = b.laneIdx;
        let myPlanks = 0, playerPlanks = 0, emptyPlanks = 0, otherBotPlanks = 0;
        b.planks.forEach(p => {
          if (p.teamId === bot.team.id) myPlanks++;
          else if (p.teamId === 'blue') playerPlanks++;
          else if (!p.teamId) emptyPlanks++;
          else otherBotPlanks++;
        });

        laneScores[lane] += myPlanks * 2.8;
        if (myPlanks === 0 && playerPlanks === 0 && otherBotPlanks === 0) laneScores[lane] += 6.5;
        if (playerPlanks > 0 && bot.stackCount >= 8) laneScores[lane] += 3.5;

        const otherBots = characters.filter(c => !c.isPlayer && c !== bot && c.currentStage === bot.currentStage);
        otherBots.forEach(ob => { if (ob.aiState === 'BUILD' && ob.targetLane === lane) laneScores[lane] -= 8; });
        
        laneScores[lane] += Math.random() * 3.0;
      });

      let bestLane = 0, maxScore = -999;
      for (let i = 0; i < 3; i++) {
        if (laneScores[i] > maxScore) { maxScore = laneScores[i]; bestLane = i; }
      }
      return bestLane;
    }

    function avoidGateObstacles(bot, dirX, dirZ) {
      let avoidX = 0, avoidZ = 0;
      for (let i = 0; i < modifierGates.length; i++) {
        const g = modifierGates[i];
        if (g.consumed || g.stageIdx !== bot.currentStage) continue;
        const posts = [g.pos.x - 1.3, g.pos.x + 1.3];
        for (let j = 0; j < posts.length; j++) {
          const px = posts[j], pz = g.pos.z;
          const dx = bot.pos.x - px, dz = bot.pos.z - pz;
          const dist = Math.hypot(dx, dz);
          if (dist < 1.15 && dist > 0.001) {
            const push = (1.15 - dist) / 1.15;
            avoidX += (dx / dist) * push * 1.8;
            avoidZ += (dz / dist) * push * 1.8;
          }
        }
      }
      const finalX = dirX + avoidX;
      const finalZ = dirZ + avoidZ;
      const mag = Math.hypot(finalX, finalZ) || 1;
      return { x: finalX / mag, z: finalZ / mag };
    }

    function updateAICharacter(bot, dt) {
      if (bot.onCurvedSlide) {
        const targetOffset = bot.botSlideOffsetTarget || 0;
        const diff = targetOffset - bot.curvedSlideOffset;
        const steerX = Math.abs(diff) > 0.08 ? Math.sign(diff) * 0.45 : 0;
        updateSingleCharacter(bot, steerX, -1.0, dt);
        return;
      }

      if (bot.onZipline) {
        updateSingleCharacter(bot, 0, -1.0, dt);
        return;
      }

      if (bot.currentStage < player.currentStage - 1) {
        bot.currentStage = player.currentStage;
        const stage = STAGES[bot.currentStage];
        if (stage) {
          bot.pos.x = (Math.random() - 0.5) * 6;
          bot.pos.z = stage.z + stage.r * 0.85; 
          bot.pos.y = stage.y;
          bot.aiState = 'COLLECT';
          bot.aiCapacityGoal = 6 + Math.floor(Math.random() * 5);
          bot.lastPlankIdx = -1;
          while (bot.stackCount < 4) { addBrickToCharacter(bot, bot.team); }
        }
        return;
      }

      const stage = STAGES[bot.currentStage];
      if (!stage) return;
      
      const activeBridge = bridges.find(b => 
        !b.isCurvedSlide && !b.isZipline &&
        b.stageIdx === bot.currentStage &&
        bot.pos.z <= b.startZ + 1.5 &&
        bot.pos.z >= b.endZ - 0.5 &&
        Math.abs(bot.pos.x - LANES[b.laneIdx]) < 2.5
      );
      const nextConn = CONNECTIONS.find(c => c.from === bot.currentStage);
      const isVerticalNext = (nextConn && nextConn.type === 'vertical');

      if (nextConn) {
        if (nextConn.type === 'slide') {
          bot.aiState = 'BUILD';
          if (bot.targetLane === undefined) bot.targetLane = Math.floor(Math.random() * 3);
        } else if (nextConn.type === 'curved_slide') {
          bot.aiState = 'BUILD';
          bot.targetLane = 1;
          bot.aiCapacityGoal = 0;
        } else if (nextConn.type === 'zipline') {
          bot.aiState = 'BUILD';
          bot.targetLane = 1;
          bot.aiCapacityGoal = 0;
        } else if (isVerticalNext) {
          if (bot.aiCapacityGoal < 18) bot.aiCapacityGoal = 18 + Math.floor(Math.random() * 4);
        }
      }

      if (bot.aiState === 'COLLECT') {
        const threshold = isVerticalNext ? Math.max(16, bot.aiCapacityGoal) : bot.aiCapacityGoal;
        if (bot.stackCount >= threshold) {
          bot.aiState = 'BUILD';
          bot.targetLane = evaluateBestLaneForBot(bot);
          return;
        }

        if (activeBridge) { 
          updateSingleCharacter(bot, 0, 1, dt); 
          return; 
        }
        if (bot.pos.z > stage.z + stage.r * 0.85) { updateSingleCharacter(bot, 0, -1, dt); return; }

        let best = null, minDist = 999;
        for (let blk of floorBlocks) {
          if (blk.active && blk.stageIdx === bot.currentStage && (blk.team.id === bot.team.id || blk.team.id === 'neutral')) {
            const d = Math.hypot(blk.pos.x - bot.pos.x, blk.pos.z - bot.pos.z);
            if (d < minDist) { minDist = d; best = blk; }
          }
        }
        
        let rawDx = 0, rawDz = 0;
        if (best) {
          rawDx = best.pos.x - bot.pos.x;
          rawDz = best.pos.z - bot.pos.z;
        } else {
          rawDx = 0 - bot.pos.x;
          rawDz = stage.z - bot.pos.z;
        }
        const len = Math.hypot(rawDx, rawDz) || 1;
        const steer = avoidGateObstacles(bot, rawDx / len, rawDz / len);
        updateSingleCharacter(bot, steer.x, steer.z, dt);

      } else if (bot.aiState === 'BUILD') {
        const b = bridges.find(br => br.stageIdx === bot.currentStage && (br.isCurvedSlide || br.isZipline || br.laneIdx === bot.targetLane));
        if (b) {
          const targetX = (b.isCurvedSlide || b.isZipline) ? 0 : LANES[b.laneIdx];
          const targetZ = bot.pos.z < b.startZ ? bot.pos.z - 2 : b.startZ - 0.5;
          const dx = targetX - bot.pos.x, dz = targetZ - bot.pos.z;
          const len = Math.hypot(dx, dz) || 1;
          
          const oldZ = bot.pos.z;
          const steer = avoidGateObstacles(bot, dx / len, dz / len);
          updateSingleCharacter(bot, steer.x, steer.z, dt);
          
          if (bot.aiState !== 'COLLECT' && Math.abs(bot.pos.z - oldZ) < 0.001) {
            bot.aiState = 'COLLECT';
            bot.aiCapacityGoal = isVerticalNext ? (18 + Math.floor(Math.random() * 4)) : (8 + Math.floor(Math.random() * 6));
            bot.targetLane = evaluateBestLaneForBot(bot); 
          }
        }
      }
    }

    function handleTackles() {
      for (let i = 0; i < characters.length; i++) {
        for (let j = i + 1; j < characters.length; j++) {
          const c1 = characters[i], c2 = characters[j];
          if (c1.currentStage !== c2.currentStage) continue;
          if (c1.invulnerableTimer > 0 || c2.invulnerableTimer > 0) continue;

          const stage = STAGES[c1.currentStage];
          if (!stage) continue;

          const onIsland1 = Math.hypot(c1.pos.x, c1.pos.z - stage.z) < stage.r;
          const onIsland2 = Math.hypot(c2.pos.x, c2.pos.z - stage.z) < stage.r;
          if (!onIsland1 || !onIsland2) continue;
          
          if (Math.hypot(c1.pos.x - c2.pos.x, c1.pos.z - c2.pos.z) < 1.3 && Math.abs(c1.pos.y - c2.pos.y) < 1.0) {
            if (c1.stackCount > c2.stackCount) tackleKnockout(c1, c2);
            else if (c2.stackCount > c1.stackCount) tackleKnockout(c2, c1);
          }
        }
      }
    }

    function tackleKnockout(winner, loser) {
      if (loser.stunTimer > 0 || loser.invulnerableTimer > 0) return;
      loser.stunTimer = 1.4;
      sound.playTackle();
      const drops = Math.max(2, Math.floor(loser.stackCount * 0.5));
      scatterBricks(loser, drops);
      const kx = loser.pos.x - winner.pos.x, kz = loser.pos.z - winner.pos.z;
      const mag = Math.hypot(kx, kz) || 1;
      const pushX = (kx / mag) * 2.0;
      const pushZ = (kz / mag) * 2.0;
      const stage = STAGES[loser.currentStage];
      if (stage) {
        const nextX = loser.pos.x + pushX;
        const nextZ = loser.pos.z + pushZ;
        const distToCenter = Math.hypot(nextX, nextZ - stage.z);
        if (distToCenter > stage.r) {
          const normX = nextX / distToCenter;
          const normZ = (nextZ - stage.z) / distToCenter;
          loser.pos.x = normX * (stage.r - 0.5);
          loser.pos.z = stage.z + normZ * (stage.r - 0.5);
        } else {
          loser.pos.x = nextX;
          loser.pos.z = nextZ;
        }
      } else {
        loser.pos.x += pushX;
        loser.pos.z += pushZ;
      }
    }

      }

      floorBlocks.forEach(b => scene.remove(b.mesh)); floorBlocks = [];
      floorItems.forEach(item => { if (item.group) scene.remove(item.group); }); floorItems = [];
      curvedSlideBonusBlocks.forEach(b => { if (b.mesh) scene.remove(b.mesh); });
      curvedSlideBonusBlocks = [];
      ziplineBonusBlocks.forEach(b => { if (b.mesh) scene.remove(b.mesh); });
      ziplineBonusBlocks = [];
      landingShockwaves.forEach(sw => scene.remove(sw.mesh));
      landingShockwaves = [];
      puffClouds.forEach(p => scene.remove(p.mesh));
      puffClouds = [];
      speedStepRings.forEach(sr => scene.remove(sr.mesh));
      speedStepRings = [];
      speedItemIslandCounter = 0;
      buildWorld();
      
      characters.forEach(c => {
        while (c.stackCount > 0) removeBrickFromCharacter(c);
        c.stunTimer = 0; c.invulnerableTimer = 0; c.currentStage = 0; c.isJumping = false; c.onSlide = false;
        c.onCurvedSlide = false; c.curvedSlideProgress = 0; c.curvedSlideOffset = 0; c.slideCooldown = 0;
        c.onZipline = false; c.ziplineProgress = 0; c.activeZipline = null;
        c.lastPlankIdx = -1;
        c.speedBoostActive = false;
        c.speedBoostUntilStage = -1;
        c.puffTimer = 0;
        if (c.meshObj.footAura) c.meshObj.footAura.visible = false;
        if (!c.isPlayer) c.botSlideOffsetTarget = 0;
        c.meshObj.root.visible = true;

        if (c.meshObj.trolleyGroup) c.meshObj.trolleyGroup.visible = false;
        c.meshObj.stackGroup.scale.set(1.0, 1.0, 1.0);
        c.meshObj.stackGroup.position.set(0, 0.65, -0.42);

        c.meshObj.leftArm.position.set(-0.48, 0.68, 0);
        c.meshObj.rightArm.position.set(0.48, 0.68, 0);
        c.meshObj.leftArm.rotation.set(0, 0, 0);
        c.meshObj.rightArm.rotation.set(0, 0, 0);
        c.meshObj.leftLeg.rotation.set(0, 0, 0);
        c.meshObj.rightLeg.rotation.set(0, 0, 0);
        c.meshObj.body.position.y = 0.65;
        c.meshObj.head.position.y = 1.25;
      });
      player.pos.set(0, STAGES[0].y, STAGES[0].z + 4);
      characters[1].pos.set(-4.0, STAGES[0].y, STAGES[0].z + 4);
      characters[2].pos.set(4.0, STAGES[0].y, STAGES[0].z + 4);

      camera.position.set(0, STAGES[0].y + 24, STAGES[0].z + 12);
      camera.lookAt(0, STAGES[0].y, STAGES[0].z - 5);
      
      for (let i = 0; i < 30; i++) manageBlockSpawns();
      updateHUD(); updateTimerHUD();
    }

    function setupControls() {
      const zone = document.getElementById('touch-control-layer');
      let touchId = null, startX = 0, startY = 0;

      function onPointerStart(x, y, id) { sound.init(); touchId = id; startX = x; startY = y; input.active = true; }
      function onPointerMove(x, y) {
        if (!input.active) return;
        const dx = x - startX, dy = y - startY, dist = Math.hypot(dx, dy), maxDist = 55;
        if (dist > 0) {
          const clamped = Math.min(dist, maxDist);
          input.x = Math.cos(Math.atan2(dy, dx)) * (clamped / maxDist);
          input.y = Math.sin(Math.atan2(dy, dx)) * (clamped / maxDist);
        }
      }
      function onPointerEnd() { input.active = false; input.x = 0; input.y = 0; touchId = null; }

      if (zone) {
        zone.addEventListener('touchstart', e => { 
          if (e.touches.length > 0) onPointerStart(e.touches[0].clientX, e.touches[0].clientY, e.touches[0].identifier); 
        }, { passive: false });
        window.addEventListener('touchmove', e => { 
          if (!input.active) return; 
          for (let i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === touchId) { onPointerMove(e.touches[i].clientX, e.touches[i].clientY); break; } 
          }
        }, { passive: false });
        window.addEventListener('touchend', onPointerEnd, { passive: false });
        window.addEventListener('touchcancel', onPointerEnd, { passive: false });
        zone.addEventListener('mousedown', e => { if (e.button === 0) onPointerStart(e.clientX, e.clientY, 'mouse'); });
        window.addEventListener('mousemove', e => { if (input.active && touchId === 'mouse') onPointerMove(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { if (touchId === 'mouse') onPointerEnd(); });
      }

      const soundBtn = document.getElementById('btn-sound');
      const iconSoundOff = document.getElementById('icon-sound-off');
      const iconSoundOn = document.getElementById('icon-sound-on');
      if (soundBtn) {
        soundBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          sound.init();
          const isMuted = sound.toggleMute();
          if (iconSoundOff && iconSoundOn) {
            if (isMuted) {
              iconSoundOff.classList.remove('hidden');
              iconSoundOn.classList.add('hidden');
            } else {
              iconSoundOff.classList.add('hidden');
              iconSoundOn.classList.remove('hidden');
            }
          }
        });
      }

      const startBtn = document.getElementById('btn-start');
      function onStartClick(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        sound.init();
        const modal = document.getElementById('modal-start');
        if (modal) {
          modal.style.display = 'none';
          modal.classList.add('hidden');
        }
        gameStarted = true;
      }
      if (startBtn) {
        startBtn.addEventListener('click', onStartClick);
        startBtn.addEventListener('touchend', onStartClick);
      }

      const restartBtn = document.getElementById('btn-restart');
      if (restartBtn) {
        restartBtn.addEventListener('click', resetGame);
        restartBtn.addEventListener('touchend', resetGame);
      }
    }

    function initThree() {
      const container = document.getElementById('canvas-container');
      if (!container) return;

      scene = new THREE.Scene(); 
      scene.background = new THREE.Color(0x7dd3fc); 
      scene.fog = new THREE.FogExp2(0x7dd3fc, 0.0032);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }); 
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); 
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x0284c7, 0.9));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
      dirLight.position.set(30, 70, 25); 
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024; 
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.left = -40; dirLight.shadow.camera.right = 40; 
      dirLight.shadow.camera.top = 40; dirLight.shadow.camera.bottom = -40;
      scene.add(dirLight);

      buildWorld(); 
      setupCharacters(); 
      for (let i = 0; i < 60; i++) manageBlockSpawns(); 
      setupControls();
      
      window.addEventListener('resize', () => { 
        if (!camera || !renderer) return;
        camera.aspect = window.innerWidth / window.innerHeight; 
        camera.updateProjectionMatrix(); 
        renderer.setSize(window.innerWidth, window.innerHeight); 
      });
    }

    let lastTime = performance.now(), blockSpawnTimer = 0, cleanupTimer = 0;
    function animate(currentTime) {
      requestAnimationFrame(animate);
      const dt = Math.min((currentTime - lastTime) / 1000, 0.05); 
      lastTime = currentTime;

      if (gameStarted && !isGameOver) {
        updateCharacters(dt);
        
        blockSpawnTimer += dt;
        if (blockSpawnTimer > 0.5) { manageBlockSpawns(); blockSpawnTimer = 0; }
        
        cleanupTimer += dt;
        if (cleanupTimer > 2.0) { cleanupOldData(); cleanupTimer = 0; }
        
        const maxStage = Math.max(...characters.map(c => c.currentStage));
        if (maxStage >= STAGES.length - 3) extendCourse();

        timeLeft -= dt;
        if (timeLeft <= 0) { timeLeft = 0; onTimeUp(); }
        updateTimerHUD();

        const timeSec = currentTime * 0.001;

        // アイテム（大粒クリスタル＆床サークル）の回転・浮遊・脈動アニメーション
        floorItems.forEach(item => {
          if (item.active && item.group) {
            if (item.crystal) {
              item.crystal.rotation.y = timeSec * 3.2;
              item.crystal.rotation.z = Math.sin(timeSec * 2.5) * 0.25;
              item.crystal.position.y = 1.35 + Math.sin(timeSec * 4.5 + item.stageIdx) * 0.22;
            }
            if (item.beaconRing) {
              const pulse = 1.0 + Math.sin(timeSec * 5.0) * 0.25;
              item.beaconRing.scale.set(pulse, pulse, pulse);
            }
          }
        });

        // ミニちぎれ雲（砂煙パフ）のフェード＆縮小更新
        for (let i = puffClouds.length - 1; i >= 0; i--) {
          const puff = puffClouds[i];
          puff.life += dt;
          const prog = puff.life / puff.maxLife;
          if (prog >= 1.0) {
            scene.remove(puff.mesh);
            puffClouds.splice(i, 1);
          } else {
            const currentScale = puff.initScale * (1.0 - prog * 0.85);
            puff.mesh.scale.set(currentScale, currentScale, currentScale);
            puff.mesh.position.y += dt * 0.45;
          }
        }

        // スピードUP中：足元ゴールド波紋（ステップリング）の拡散・フェード更新
        for (let i = speedStepRings.length - 1; i >= 0; i--) {
          const sRing = speedStepRings[i];
          sRing.life += dt;
          const prog = sRing.life / sRing.maxLife;
          if (prog >= 1.0) {
            scene.remove(sRing.mesh);
            speedStepRings.splice(i, 1);
          } else {
            sRing.scale += dt * 3.4;
            sRing.mesh.scale.set(sRing.scale, sRing.scale, sRing.scale);
            sRing.mesh.material.opacity = (1.0 - prog) * 0.75;
          }
        }

        curvedSlideBonusBlocks.forEach(blk => {
          if (!blk.collected && blk.mesh) {
            blk.mesh.rotation.y = timeSec * 2.8 + blk.t * 4.0;
          }
        });

        ziplineBonusBlocks.forEach(blk => {
          if (!blk.collected && blk.mesh) {
            blk.mesh.rotation.y = timeSec * 3.2 + blk.t * 4.5;
            blk.mesh.position.y = blk.baseY + Math.sin(timeSec * 3.5 + blk.zi) * 0.14;
          }
        });

        cloudObjects.forEach(c => {
          c.mesh.position.y = c.baseY + Math.sin(timeSec + c.offset) * 0.4;
          c.mesh.rotation.y = Math.sin(timeSec * 0.3 + c.offset) * 0.08;
        });

        for (let i = landingShockwaves.length - 1; i >= 0; i--) {
          const sw = landingShockwaves[i];
          sw.life += dt;
          sw.scale += dt * 6.5;
          sw.mesh.scale.set(sw.scale, sw.scale, sw.scale);
          sw.mesh.material.opacity = Math.max(0, 0.9 - sw.life * 2.2);
          if (sw.life > 0.45) {
            scene.remove(sw.mesh);
            landingShockwaves.splice(i, 1);
          }
        }
      }

      if (player && camera) {
        const currentStageObj = STAGES[player.currentStage];
        const nextConn = CONNECTIONS.find(c => c.from === player.currentStage);
        const isVerticalClimb = (nextConn && nextConn.type === 'vertical' && player.pos.z < (currentStageObj ? currentStageObj.z - currentStageObj.r * 0.8 : 0));
        const isSlideRiding = player.onSlide;
        const isCurvedRiding = player.onCurvedSlide;
        const isZiplining = player.onZipline;

        let targetCamX = player.pos.x * 0.2;
        let targetCamY = player.pos.y + 24; 
        let targetCamZ = player.pos.z + 12;
        let targetLookX = player.pos.x * 0.1;
        let targetLookY = player.pos.y;
        let targetLookAheadZ = player.pos.z - 5;
        // スピードUP中は画面が自然に広々とする程度（FOV 60 -> 63）に調整
        let targetFOV = player.speedBoostActive ? 63 : 60;

        if (isVerticalClimb) {
          targetCamY = player.pos.y + 26;
          targetCamZ = player.pos.z + 16;
          targetLookY = player.pos.y + 4;
          targetFOV = 65;
        } else if (isZiplining) {
          targetCamX = player.pos.x + 5.6;
          targetCamY = player.pos.y + 4.2;
          targetCamZ = player.pos.z + 11.5;
          targetLookX = player.pos.x - 0.4;
          targetLookY = player.pos.y + 0.6;
          targetLookAheadZ = player.pos.z - 18;
          targetFOV = 68;
        } else if (isCurvedRiding) {
          targetCamY = player.pos.y + 16;
          targetCamZ = player.pos.z + 9;
          targetLookY = player.pos.y - 1.2;
          targetFOV = 67;
        } else if (isSlideRiding) {
          targetCamY = player.pos.y + 18;
          targetCamZ = player.pos.z + 9;
          targetLookY = player.pos.y - 1;
          targetFOV = 63;
        }

        camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, 0.14);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, targetCamY, 0.16);
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetCamZ, 0.14);

        if (Math.abs(camera.fov - targetFOV) > 0.1) {
          camera.fov = THREE.MathUtils.lerp(camera.fov, targetFOV, 0.08);
          camera.updateProjectionMatrix();
        }
        
        camera.lookAt(targetLookX, targetLookY, targetLookAheadZ);

        if (seaMesh) {
          seaMesh.position.z = player.pos.z - 200;
        }
      }
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    function bootGame() {
      if (window._gameEngineBooted) return;
      window._gameEngineBooted = true;
      try {
        initThree(); 
        animate(performance.now());
      } catch (err) {
        console.error("Game boot failed:", err);
      }
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      bootGame();
    } else {
      document.addEventListener('DOMContentLoaded', bootGame);
      window.addEventListener('load', bootGame);
    }
  </script>
</body>
</html>
