        const slideSpeed = 31.0;
        const progressDelta = (slideSpeed * dt) / Math.max(10, b.curveLength);
        char.curvedSlideProgress += progressDelta;

        if (char.curvedSlideProgress >= 1.0) {
          char.onCurvedSlide = false;
          char.currentStage = b.nextStageIdx;
          const nextStageObj = STAGES[b.nextStageIdx];
          char.pos.set(char.curvedSlideOffset * 0.6, nextStageObj.y, nextStageObj.z + nextStageObj.r * 0.4);
          char.slideCooldown = 1.4;
          char.lastPlankIdx = -1;
          char.activeCurvedBridge = null;

          if (!char.isPlayer) {
            char.aiState = 'COLLECT';
            char.targetLane = undefined;
            char.aiCapacityGoal = 14 + Math.floor(Math.random() * 5);
          }
        } else {
          const t = Math.min(0.999, Math.max(0, char.curvedSlideProgress));
          const pt = b.curve.getPointAt(t);
          const tangent = b.curve.getTangentAt(t).normalize();
          _tempVec3C.set(-tangent.z, 0, tangent.x).normalize();

          char.curvedSlideOffset = Math.max(-1.6, Math.min(1.6, char.curvedSlideOffset + dirX * 12 * dt));

          char.pos.copy(pt).addScaledVector(_tempVec3C, char.curvedSlideOffset);
          char.pos.y = pt.y + 0.18;

          if (b.bonusBlocks && b.bonusBlocks.length > 0) {
            for (let bi = 0; bi < b.bonusBlocks.length; bi++) {
              const blk = b.bonusBlocks[bi];
              if (!blk.collected) {
                const progDiff = Math.abs(blk.t - char.curvedSlideProgress);
                const offsetDiff = Math.abs(blk.offset - char.curvedSlideOffset);
                if (progDiff < 0.045 && offsetDiff < 0.95) {
                  blk.collected = true;
                  scene.remove(blk.mesh);
                  addBrickToCharacter(char, char.team, 1);
                  if (char.isPlayer) {
                    sound.playCollect(1.2 + blk.t * 0.6);
                  }
                }
              }
            }
          }

          char.rotation = Math.atan2(tangent.x, tangent.z);
          char.meshObj.root.rotation.y = char.rotation;
          char.meshObj.root.rotation.z = -dirX * 0.35 - (_tempVec3C.x * 0.2);
          char.meshObj.root.rotation.x = 0.25;

          char.meshObj.leftLeg.rotation.x = -0.35;
          char.meshObj.rightLeg.rotation.x = -0.35;
          char.meshObj.leftArm.rotation.x = -0.65;
          char.meshObj.rightArm.rotation.x = -0.65;
          char.meshObj.body.position.y = 0.50;
          char.meshObj.head.position.y = 1.15;

          if (char.isPlayer) sound.playSlide();
        }

        char.meshObj.root.position.copy(char.pos);
        return;
      }

      let speed = char.speedBoostActive ? 17.0 : 10.5;

      if (char.onSlide) {
        speed = 28;
        if (char.isPlayer) sound.playSlide();
      }

      let effectiveDirX = dirX;
      let effectiveDirZ = dirZ;
      if (char.onSlide) {
        effectiveDirZ = -1.0;
        effectiveDirX = dirX * 0.8;
      }

      const moveMag = Math.hypot(effectiveDirX, effectiveDirZ);
      if (moveMag > 0.08 || char.onSlide) {
        const turnLerp = (char.speedBoostActive && !char.onSlide) ? 0.40 : 0.22;
        char.rotation = THREE.MathUtils.lerp(char.rotation, Math.atan2(effectiveDirX, effectiveDirZ), turnLerp);
        char.meshObj.root.rotation.y = char.rotation;

        const nextX = char.pos.x + effectiveDirX * speed * dt;
        const nextZ = char.pos.z + effectiveDirZ * speed * dt;

        handleCourseMovement(char, nextX, nextZ, effectiveDirX, effectiveDirZ);

        const walkCycleSpeed = (char.onSlide ? 0 : 16) * (char.speedBoostActive ? 1.75 : 1.0);
        char.walkCycle += dt * walkCycleSpeed; 
        
        if (char.onSlide) {
          char.meshObj.leftLeg.rotation.x = -0.3;
          char.meshObj.rightLeg.rotation.x = -0.3;
          char.meshObj.leftArm.rotation.x = -0.6;
          char.meshObj.rightArm.rotation.x = -0.6;
          char.meshObj.body.position.y = 0.50;
          char.meshObj.head.position.y = 1.15;
          char.meshObj.root.rotation.x = 0.22;
          char.meshObj.root.rotation.z = -effectiveDirX * 0.35;
        } else {
          const swing = Math.sin(char.walkCycle) * 0.75;
          char.meshObj.leftLeg.rotation.x = swing;
          char.meshObj.rightLeg.rotation.x = -swing;
          char.meshObj.leftArm.rotation.x = -swing;
          char.meshObj.rightArm.rotation.x = swing;
          
          const bounce = Math.abs(Math.sin(char.walkCycle * 2)) * 0.12; 
          char.meshObj.body.position.y = 0.65 + bounce;
          char.meshObj.head.position.y = 1.25 + bounce;

          char.meshObj.root.rotation.x = char.speedBoostActive ? 0.20 : 0;
          char.meshObj.root.rotation.z = 0;
        }
        char.meshObj.stackGroup.rotation.z = Math.sin(char.walkCycle) * 0.05;

        if (char.speedBoostActive && !char.onSlide) {
          char.puffTimer = (char.puffTimer || 0) + dt;
          if (char.puffTimer > 0.085) {
            char.puffTimer = 0;
            const backDist = 0.45;
            const puffX = char.pos.x - Math.sin(char.rotation) * backDist;
            const puffZ = char.pos.z - Math.cos(char.rotation) * backDist;
            spawnPuffCloud(puffX, char.pos.y, puffZ);
            spawnSpeedStepRing(char.pos.x, char.pos.y, char.pos.z);
          }
        }
      } else {
        char.meshObj.leftLeg.rotation.x = THREE.MathUtils.lerp(char.meshObj.leftLeg.rotation.x, 0, 0.2);
        char.meshObj.rightLeg.rotation.x = THREE.MathUtils.lerp(char.meshObj.rightLeg.rotation.x, 0, 0.2);
        char.meshObj.leftArm.rotation.x = THREE.MathUtils.lerp(char.meshObj.leftArm.rotation.x, 0, 0.2);
        char.meshObj.rightArm.rotation.x = THREE.MathUtils.lerp(char.meshObj.rightArm.rotation.x, 0, 0.2);
        char.meshObj.root.rotation.x = 0;
        char.meshObj.root.rotation.z = 0;
      }

      if (char.meshObj.footAura) {
        if (char.speedBoostActive) {
          char.meshObj.footAura.visible = true;
          const auraPulse = 1.0 + Math.sin(performance.now() * 0.008) * 0.12;
          char.meshObj.footAura.scale.set(auraPulse, auraPulse, auraPulse);
        } else {
          char.meshObj.footAura.visible = false;
        }
      }

      if (!char.onSlide && !char.onCurvedSlide && !char.onZipline) {
        for (let i = stageBlocks.length - 1; i >= 0; i--) {
          const blk = stageBlocks[i];
          if (!blk.active) continue;
          if ((blk.team.id === char.team.id || blk.team.id === 'neutral') && Math.abs(char.pos.y - blk.pos.y) < 1.4) {
            const dx = char.pos.x - blk.pos.x;
            const dz = char.pos.z - blk.pos.z;
            if (dx * dx + dz * dz < 2.25) {
              blk.active = false;
              scene.remove(blk.mesh);
              stageBlocks.splice(i, 1);
              addBrickToCharacter(char, char.team);
            }
          }
        }

        for (let i = floorItems.length - 1; i >= 0; i--) {
          const item = floorItems[i];
          if (!item.active || item.stageIdx !== char.currentStage) continue;
          if (Math.abs(char.pos.y - item.pos.y) < 2.2) {
            const dx = char.pos.x - item.pos.x;
            const dz = char.pos.z - item.pos.z;
            if (dx * dx + dz * dz < 2.89) {
              item.active = false;
              if (item.group) {
                disposeHierarchy(item.group);
                scene.remove(item.group);
              }
              floorItems.splice(i, 1);

              if (item.type === 'speed') {
                char.speedBoostActive = true;
                char.speedBoostTimer = 12.0;
                if (char.meshObj.footAura) char.meshObj.footAura.visible = true;
                addBrickToCharacter(char, char.team, 3);
                if (char.isPlayer) sound.playItemGet();
              } else if (item.type === 'attack') {
                fireHomingCrystal(char);
              } else if (item.type === 'magnet') {
                char.magnetActive = true;
                char.magnetTimer = 6.5;
                if (char.meshObj.magnetAura) char.meshObj.magnetAura.visible = true;
                if (char.isPlayer) sound.playMagnetCharge();
              }
            }
          }
        }

        checkGateCollisions(char);
      }

      const currentStageObj = STAGES[char.currentStage];
      const nextStageObj = STAGES[char.currentStage + 1];
      const lowestAllowedY = Math.min(
        currentStageObj ? currentStageObj.y : 0,
        nextStageObj ? nextStageObj.y : 0
      ) - 10.0;

      if (!char.isJumping && !char.onCurvedSlide && !char.onZipline && char.pos.y < lowestAllowedY) {
        if (currentStageObj) {
          char.pos.set(0, currentStageObj.y, currentStageObj.z);
          char.onSlide = false;
          char.invulnerableTimer = 1.0;
        }
      }

      char.meshObj.root.position.copy(char.pos);
    }

    function handleCourseMovement(char, nextX, nextZ, inputDirX, inputDirZ) {
      char.onSlide = false;
      const isMovingDownwardOrBackward = (nextZ >= char.pos.z - 0.001) || (inputDirZ >= -0.05);
      const isForwardIntent = !isMovingDownwardOrBackward && (inputDirZ < -0.05);

      const curStageObj = STAGES[char.currentStage];
      
      const isFarFromBridges = curStageObj && 
        char.lastPlankIdx < 0 && 
        !char.onSlide && !char.onCurvedSlide && !char.onZipline &&
        (nextZ > curStageObj.z - curStageObj.r * 0.72) &&
        (char.pos.z > curStageObj.z - curStageObj.r * 0.72);

      if (!isFarFromBridges) {
        const zipB = bridges.find(b => b.isZipline && b.stageIdx === char.currentStage);
        if (zipB && char.slideCooldown <= 0) {
          const distToStart = Math.hypot(nextX, nextZ - zipB.startZ);
          if (distToStart < 3.2 && isForwardIntent) {
            char.onZipline = true;
            char.ziplineProgress = 0;
            char.activeZipline = zipB;
            return;
          }
        }

        const curvedB = bridges.find(b => b.isCurvedSlide && b.stageIdx === char.currentStage);
        if (curvedB && char.slideCooldown <= 0) {
          const distToStart = Math.hypot(nextX, nextZ - curvedB.startZ);
          if (distToStart < 3.2 && isForwardIntent) {
            char.onCurvedSlide = true;
            char.curvedSlideProgress = 0;
            char.curvedSlideOffset = Math.max(-1.5, Math.min(1.5, nextX));
            char.activeCurvedBridge = curvedB;
            if (!char.isPlayer) {
              char.botSlideOffsetTarget = (Math.random() - 0.5) * 1.5;
            }
            return;
          }
        }

        let onBridge = null;
        for (let b of bridges) {
          if (b.isCurvedSlide || b.isZipline) continue;

          if (char.currentStage !== b.stageIdx && char.currentStage !== b.nextStageIdx) continue;

          if (Math.abs(nextX - LANES[b.laneIdx]) > 1.85) continue;
          if (nextZ > b.startZ + 0.15 || nextZ < b.endZ - 0.8) continue;

          if (char.currentStage === b.nextStageIdx) {
            const isBridgeOpen = b.isSlide || b.isJump || b.planks.every(p => p.teamId !== null);
            if (!isBridgeOpen && nextZ > b.endZ) {
              continue;
            }
          }

          if (nextZ <= b.startZ + 0.15 && nextZ >= b.endZ - 0.2) {
            onBridge = b;
            break;
          }
        }

        if (onBridge) {
          if (char.currentStage === onBridge.nextStageIdx) {
            const isBridgeOpen = onBridge.isSlide || onBridge.isJump || onBridge.planks.every(p => p.teamId !== null);
            if (!isBridgeOpen) {
              char.pos.z = Math.min(char.pos.z, onBridge.endZ - 0.2);
              return;
            }
          }

          if (char.pos.z <= onBridge.endZ + 0.2 && isMovingDownwardOrBackward) {
            const isBridgeOpen = onBridge.isSlide || onBridge.isJump || onBridge.planks.every(p => p.teamId !== null);
            if (!isBridgeOpen) {
              char.pos.z = onBridge.endZ - 0.2;
              return;
            }
          }

          if (nextZ <= onBridge.endZ + 0.8) {
            const lastPlank = onBridge.planks[onBridge.planks.length - 1];
            const canPassEnd = onBridge.isSlide || onBridge.isJump || (lastPlank && lastPlank.teamId === char.team.id);
            if (canPassEnd) {
              char.currentStage = onBridge.nextStageIdx;
              if (onBridge.isSlide) {
                const maxR = STAGES[onBridge.nextStageIdx].r - 1.5;
                char.pos.x = Math.max(-maxR, Math.min(maxR, nextX));
              } else {
                char.pos.x = LANES[onBridge.laneIdx];
              }
              char.pos.z = nextZ;
              char.pos.y = STAGES[onBridge.nextStageIdx].y;
              char.lastPlankIdx = -1;
              char.onSlide = false;
              
              if (!char.isPlayer) {
                char.aiState = 'COLLECT';
                char.targetLane = undefined;
                char.aiCapacityGoal = 14 + Math.floor(Math.random() * 5);
              }
              return;
            }
          }

          if (nextZ >= onBridge.startZ) {
            char.currentStage = onBridge.stageIdx;
            char.pos.x = LANES[onBridge.laneIdx];
            char.pos.z = nextZ;
            char.pos.y = STAGES[onBridge.stageIdx].y;
            char.lastPlankIdx = -1;
            char.onSlide = false;
            return;
          }

          const progress = Math.min(Math.max((onBridge.startZ - nextZ) / (onBridge.startZ - onBridge.endZ), 0), 0.999);
          const plankIdx = Math.floor(progress * onBridge.planks.length);
          
          if (plankIdx >= 0 && plankIdx < onBridge.planks.length) {
            const plank = onBridge.planks[plankIdx];
            
            if (plank.isJumpPad) {
              if (isForwardIntent) {
                char.isJumping = true;
                char.jumpProgress = 0;
                char.jumpStartX = char.pos.x; char.jumpStartY = char.pos.y; char.jumpStartZ = char.pos.z;
                char.jumpTargetStage = onBridge.nextStageIdx;
                char.jumpTargetX = LANES[onBridge.laneIdx];
                char.lastPlankIdx = -1;
                char.activeJumpTier = plank.jumpTier || TRAMPOLINE_TIERS.normal;
                
                const dipY = char.activeJumpTier.dip || -0.15;
                if (plank.netMesh) {
                  plank.netMesh.scale.set(1.15, 0.2, 1.15);
                  plank.netMesh.position.y = 0.50 + dipY;
                  setTimeout(() => {
                    if (plank.netMesh) {
                      plank.netMesh.scale.set(1.0, 1.0, 1.0);
                      plank.netMesh.position.y = 0.50;
                    }
                  }, 180);
                }
                if (char.isPlayer) sound.playJump(char.activeJumpTier.id);
              }
              return;
            }

            if (onBridge.isSlide) {
              const laneCenterX = LANES[onBridge.laneIdx];
              const maxOffset = 1.35;
              char.pos.x = Math.max(laneCenterX - maxOffset, Math.min(laneCenterX + maxOffset, nextX));
              char.pos.z = nextZ; 
              char.pos.y = plank.y;
              char.onSlide = true;
              char.lastPlankIdx = plankIdx;
              return;
            }

            if (isForwardIntent) {
              if (char.currentStage !== onBridge.stageIdx && char.lastPlankIdx < 0) {
                return;
              }

              const startIdx = (char.lastPlankIdx >= 0 && char.lastPlankIdx <= plankIdx) ? char.lastPlankIdx : 0;
              let blocked = false;

              for (let pIndex = startIdx; pIndex <= plankIdx; pIndex++) {
                const currentP = onBridge.planks[pIndex];

                if (pIndex > 0 && onBridge.planks[pIndex - 1].teamId === null) {
                  blocked = true;
                  const blockedZ = onBridge.startZ - ((pIndex - 1) / onBridge.planks.length) * (onBridge.startZ - onBridge.endZ);
                  char.pos.x = LANES[onBridge.laneIdx];
                  char.pos.z = blockedZ + 0.2;
                  char.pos.y = onBridge.planks[pIndex - 1].y;
                  if (!char.isPlayer) {
                    char.aiState = 'COLLECT';
                    char.targetLane = undefined;
                  }
                  break;
                }

                if (currentP.teamId !== char.team.id) {
                  if (char.stackCount > 0) {
                    removeBrickFromCharacter(char);
                    currentP.teamId = char.team.id;

                    if (onBridge.solidMesh && onBridge.ghostMesh) {
                      dummyPlankObj.position.set(LANES[onBridge.laneIdx], currentP.y, currentP.z);
                      dummyPlankObj.rotation.set(0, 0, 0);
                      dummyPlankObj.scale.set(0, 0, 0);
                      dummyPlankObj.updateMatrix();
                      onBridge.ghostMesh.setMatrixAt(pIndex, dummyPlankObj.matrix);
                      onBridge.ghostMesh.instanceMatrix.needsUpdate = true;

                      dummyPlankObj.scale.set(1, 1, 1);
                      dummyPlankObj.updateMatrix();
                      onBridge.solidMesh.setMatrixAt(pIndex, dummyPlankObj.matrix);
                      onBridge.solidMesh.instanceMatrix.needsUpdate = true;

                      if (char.team.id === 'blue') onBridge.solidMesh.setColorAt(pIndex, COLOR_BLUE_PLANK);
                      else if (char.team.id === 'red') onBridge.solidMesh.setColorAt(pIndex, COLOR_RED_PLANK);
                      else if (char.team.id === 'yellow') onBridge.solidMesh.setColorAt(pIndex, COLOR_YELLOW_PLANK);

                      if (onBridge.solidMesh.instanceColor) {
                        onBridge.solidMesh.instanceColor.needsUpdate = true;
                      }
                    }

                    if (char.isPlayer) {
                      sound.playBuildPlank();
                      placedPlankCount++;
                      updateHUD();
                    }
                  } else {
                    blocked = true;
                    const blockedZ = onBridge.startZ - (pIndex / onBridge.planks.length) * (onBridge.startZ - onBridge.endZ);
                    char.pos.x = LANES[onBridge.laneIdx];
                    char.pos.z = blockedZ + 0.2; 
                    char.pos.y = currentP.y;
                    if (!char.isPlayer) {
                      char.aiState = 'COLLECT';
                      char.targetLane = undefined;
                    }
                    break;
                  }
                }
              }

              if (!blocked) {
                char.pos.x = LANES[onBridge.laneIdx];
                char.pos.z = nextZ;
                char.pos.y = plank.y;
                char.lastPlankIdx = plankIdx;
              }
            } else {
              char.pos.x = LANES[onBridge.laneIdx];
              char.pos.z = nextZ;
              char.pos.y = plank.y;
              char.lastPlankIdx = plankIdx;
            }
          }
          return;
        }
      }

      let onStage = null;
      for (let i = Math.max(0, char.currentStage - 1); i < STAGES.length; i++) {
        const stage = STAGES[i];
        const dx = nextX;
        const dz = nextZ - stage.z;
        const inCircle = (dx * dx + dz * dz) < ((stage.r + 1.0) * (stage.r + 1.0));
        if (inCircle) {
          onStage = i;
          break;
        }
      }

      if (onStage !== null) {
        char.pos.x = nextX;
        char.pos.z = nextZ;
        char.pos.y = STAGES[onStage].y;
        char.currentStage = onStage;
        char.lastPlankIdx = -1;
        char.onSlide = false;
        return;
      }

      if (!char.isPlayer) {
        const curStage = STAGES[char.currentStage];
        if (curStage) {
          const dx = nextX;
          const dz = nextZ - curStage.z;
          const dist = Math.hypot(dx, dz);
          const safeR = curStage.r - 0.45;
          if (dist > safeR && dist > 0.001) {
            char.pos.x = (dx / dist) * safeR;
            char.pos.z = curStage.z + (dz / dist) * safeR;
            char.pos.y = curStage.y;
            char.lastPlankIdx = -1;
            char.onSlide = false;
            return;
          }
        }
      }
    }

    function evaluateBestLaneForBot(bot) {
      const laneScores = [0, 0, 0];
      let validBridgeCount = 0;

      for (let bIdx = 0; bIdx < bridges.length; bIdx++) {
        const b = bridges[bIdx];
        if (b.stageIdx !== bot.currentStage || b.isJump || b.isSlide || b.isCurvedSlide || b.isZipline) {
          continue;
        }

        validBridgeCount++;
        const lane = b.laneIdx;
        let myPlanks = 0, playerPlanks = 0, emptyPlanks = 0, otherBotPlanks = 0;

        for (let pIdx = 0; pIdx < b.planks.length; pIdx++) {
          const teamId = b.planks[pIdx].teamId;
          if (teamId === bot.team.id) myPlanks++;
          else if (teamId === 'blue') playerPlanks++;
          else if (!teamId) emptyPlanks++;
          else otherBotPlanks++;
        }

        laneScores[lane] += myPlanks * 2.8;
        if (myPlanks === 0 && playerPlanks === 0 && otherBotPlanks === 0) laneScores[lane] += 6.5;
        if (playerPlanks > 0 && bot.stackCount >= 8) laneScores[lane] += 3.5;

        for (let cIdx = 0; cIdx < characters.length; cIdx++) {
          const otherChar = characters[cIdx];
          if (!otherChar.isPlayer && otherChar !== bot && otherChar.currentStage === bot.currentStage) {
            if (otherChar.aiState === 'BUILD' && otherChar.targetLane === lane) {
              laneScores[lane] -= 8;
            }
          }
        }

        laneScores[lane] += Math.random() * 3.0;
      }

      if (validBridgeCount === 0) return Math.floor(Math.random() * 3);

      let bestLane = 0, maxScore = -999;
      for (let i = 0; i < 3; i++) {
        if (laneScores[i] > maxScore) { maxScore = laneScores[i]; bestLane = i; }
      }
      return bestLane;
    }

    function avoidGateObstacles(bot, dirX, dirZ) {
      let avoidX = 0, avoidZ = 0;
      for (let i = 0; i < modifierGates.length; i++) {
        const g = modifierGates[i];
        if (g.consumed || g.stageIdx !== bot.currentStage) continue;
        const posts = [g.pos.x - 1.3, g.pos.x + 1.3];
        for (let j = 0; j < posts.length; j++) {
          const px = posts[j], pz = g.pos.z;
          const dx = bot.pos.x - px, dz = bot.pos.z - pz;
          const distSq = dx * dx + dz * dz;
          if (distSq < 1.44 && distSq > 0.000001) {
            const dist = Math.sqrt(distSq);
            const push = (1.20 - dist) / 1.20;
            avoidX += (dx / dist) * push * 1.8;
            avoidZ += (dz / dist) * push * 1.8;
            const tangentSign = (dx >= 0) ? 1.0 : -1.0;
            avoidX += (-dz / dist) * push * 1.2 * tangentSign;
            avoidZ += (dx / dist) * push * 1.2 * tangentSign;
          }
        }
      }
      const finalX = dirX + avoidX;
      const finalZ = dirZ + avoidZ;
      const magSq = finalX * finalX + finalZ * finalZ;
      const mag = magSq > 0.0001 ? Math.sqrt(magSq) : 1;
      _tempAvoidResult.x = finalX / mag;
      _tempAvoidResult.z = finalZ / mag;
      return _tempAvoidResult;
    }

    function updateAICharacter(bot, dt) {
      if (bot.onCurvedSlide) {
        const targetOffset = bot.botSlideOffsetTarget || 0;
        const diff = targetOffset - bot.curvedSlideOffset;
        const steerX = Math.abs(diff) > 0.08 ? Math.sign(diff) * 0.45 : 0;
        updateSingleCharacter(bot, steerX, -1.0, dt);
        return;
      }

      if (bot.onZipline) {
        updateSingleCharacter(bot, 0, -1.0, dt);
        return;
      }

      if (bot.currentStage < player.currentStage - 1) {
        bot.currentStage = player.currentStage;
        const stage = STAGES[bot.currentStage];
        if (stage) {
          bot.pos.x = (Math.random() - 0.5) * 6;
          bot.pos.z = stage.z + stage.r * 0.85; 
          bot.pos.y = stage.y;
          bot.aiState = 'COLLECT';
          bot.aiCapacityGoal = 14 + Math.floor(Math.random() * 5);
          bot.lastPlankIdx = -1;
          bot.targetBlock = null;
          bot.searchCooldown = (bot.team.id === 'red') ? 0 : 0.06;
          while (bot.stackCount < 4) { addBrickToCharacter(bot, bot.team); }
        }
        return;
      }

      const stage = STAGES[bot.currentStage];
      if (!stage) return;
      
      const activeBridge = bridges.find(b => 
        !b.isCurvedSlide && !b.isZipline &&
        b.stageIdx === bot.currentStage &&
        bot.pos.z <= b.startZ + 1.5 &&
        bot.pos.z >= b.endZ - 0.5 &&
        Math.abs(bot.pos.x - LANES[b.laneIdx]) < 2.5
      );
      const nextConn = CONNECTIONS.find(c => c.from === bot.currentStage);
      const isVerticalNext = (nextConn && nextConn.type === 'vertical');

      if (nextConn) {
        if (nextConn.type === 'slide') {
          bot.aiState = 'BUILD';
          if (bot.targetLane === undefined) bot.targetLane = Math.floor(Math.random() * 3);
        } else if (nextConn.type === 'curved_slide') {
          bot.aiState = 'BUILD';
          bot.targetLane = 1;
          bot.aiCapacityGoal = 0;
        } else if (nextConn.type === 'zipline') {
          bot.aiState = 'BUILD';
          bot.targetLane = 1;
          bot.aiCapacityGoal = 0;
        } else if (nextConn.type === 'jump') {
          bot.aiState = 'BUILD';
          if (bot.targetLane === undefined) bot.targetLane = Math.floor(Math.random() * 3);
          bot.aiCapacityGoal = 0;
        } else if (isVerticalNext) {
          if (bot.aiCapacityGoal < 18) bot.aiCapacityGoal = 18 + Math.floor(Math.random() * 4);
        }
      }

      if (bot.aiState === 'COLLECT') {
        const threshold = isVerticalNext ? Math.max(18, bot.aiCapacityGoal) : bot.aiCapacityGoal;
        if (bot.stackCount >= threshold) {
          bot.aiState = 'BUILD';
          bot.targetLane = evaluateBestLaneForBot(bot);
          bot.targetBlock = null;
          return;
        }

        if (activeBridge) { 
          updateSingleCharacter(bot, 0, 1, dt); 
          return; 
        }
        if (bot.pos.z > stage.z + stage.r * 0.85) { updateSingleCharacter(bot, 0, -1, dt); return; }

        const stageBlocks = getFloorBlocksForStage(bot.currentStage);

        bot.searchCooldown = (bot.searchCooldown || 0) - dt;
        if (bot.searchCooldown <= 0 || !bot.targetBlock || !bot.targetBlock.active || bot.targetBlock.stageIdx !== bot.currentStage) {
          bot.searchCooldown = 0.12;
          let best = null, minDistSq = 999999;
          for (let bIdx = 0; bIdx < stageBlocks.length; bIdx++) {
            const blk = stageBlocks[bIdx];
            if (blk.active && (blk.team.id === bot.team.id || blk.team.id === 'neutral')) {
              const dx = blk.pos.x - bot.pos.x;
              const dz = blk.pos.z - bot.pos.z;
              const dSq = dx * dx + dz * dz;
              if (dSq < minDistSq) { minDistSq = dSq; best = blk; }
            }
          }
          bot.targetBlock = best;
        }
        
        let rawDx = 0, rawDz = 0;
        if (bot.targetBlock && bot.targetBlock.active) {
          rawDx = bot.targetBlock.pos.x - bot.pos.x;
          rawDz = bot.targetBlock.pos.z - bot.pos.z;
        } else {
          const timeSec = performance.now() * 0.0015;
          const patrolX = Math.sin(timeSec + bot.team.hex) * 4.2;
          const patrolZ = stage.z + Math.cos(timeSec * 0.8 + bot.team.hex) * 4.2;
          rawDx = patrolX - bot.pos.x;
          rawDz = patrolZ - bot.pos.z;
        }
        const lenSq = rawDx * rawDx + rawDz * rawDz;
        const len = lenSq > 0.0001 ? Math.sqrt(lenSq) : 1;
        const steer = avoidGateObstacles(bot, rawDx / len, rawDz / len);

        bot.aiDirX = THREE.MathUtils.lerp(bot.aiDirX || 0, steer.x, 0.16);
        bot.aiDirZ = THREE.MathUtils.lerp(bot.aiDirZ || -1, steer.z, 0.16);
        const dirMagSq = bot.aiDirX * bot.aiDirX + bot.aiDirZ * bot.aiDirZ;
        const dirMag = dirMagSq > 0.0001 ? Math.sqrt(dirMagSq) : 1;
        updateSingleCharacter(bot, bot.aiDirX / dirMag, bot.aiDirZ / dirMag, dt);

      } else if (bot.aiState === 'BUILD') {
        const b = bridges.find(br => br.stageIdx === bot.currentStage && (br.isCurvedSlide || br.isZipline || br.laneIdx === bot.targetLane));
        if (b) {
          const targetX = (b.isCurvedSlide || b.isZipline) ? 0 : LANES[b.laneIdx];
          const targetZ = bot.pos.z < b.startZ ? bot.pos.z - 2 : b.startZ - 0.5;
          const dx = targetX - bot.pos.x, dz = targetZ - bot.pos.z;
          const lenSq = dx * dx + dz * dz;
          const len = lenSq > 0.0001 ? Math.sqrt(lenSq) : 1;
          
          const oldZ = bot.pos.z;
          const steer = avoidGateObstacles(bot, dx / len, dz / len);
          bot.aiDirX = THREE.MathUtils.lerp(bot.aiDirX || 0, steer.x, 0.22);
          bot.aiDirZ = THREE.MathUtils.lerp(bot.aiDirZ || -1, steer.z, 0.22);
          const dirMagSq = bot.aiDirX * bot.aiDirX + bot.aiDirZ * bot.aiDirZ;
          const dirMag = dirMagSq > 0.0001 ? Math.sqrt(dirMagSq) : 1;
          updateSingleCharacter(bot, bot.aiDirX / dirMag, bot.aiDirZ / dirMag, dt);
          
          if (bot.aiState !== 'COLLECT' && Math.abs(bot.pos.z - oldZ) < 0.0005) {
            if (b.isZipline || b.isCurvedSlide || b.isSlide || b.isJump) {
              bot.pos.z -= 0.06;
            } else {
              bot.aiState = 'COLLECT';
              bot.aiCapacityGoal = isVerticalNext ? (20 + Math.floor(Math.random() * 4)) : (14 + Math.floor(Math.random() * 5));
              bot.targetLane = evaluateBestLaneForBot(bot); 
              bot.targetBlock = null;
              bot.searchCooldown = (bot.team.id === 'red') ? 0 : 0.06;
            }
          }
        } else {
          bot.aiState = 'COLLECT';
        }
      }
    }

    function handleTackles() {
      for (let i = 0; i < characters.length; i++) {
        for (let j = i + 1; j < characters.length; j++) {
          const c1 = characters[i], c2 = characters[j];
          if (c1.currentStage !== c2.currentStage) continue;
          if (c1.invulnerableTimer > 0 || c2.invulnerableTimer > 0) continue;

          const stage = STAGES[c1.currentStage];
          if (!stage) continue;

          const onIsland1 = (c1.pos.x * c1.pos.x + (c1.pos.z - stage.z) * (c1.pos.z - stage.z)) < (stage.r * stage.r);
          const onIsland2 = (c2.pos.x * c2.pos.x + (c2.pos.z - stage.z) * (c2.pos.z - stage.z)) < (stage.r * stage.r);
          if (!onIsland1 || !onIsland2) continue;
          
          const tdx = c1.pos.x - c2.pos.x;
          const tdz = c1.pos.z - c2.pos.z;
          if ((tdx * tdx + tdz * tdz < 1.69) && Math.abs(c1.pos.y - c2.pos.y) < 1.0) {
            if (c1.stackCount > c2.stackCount) tackleKnockout(c1, c2);
            else if (c2.stackCount > c1.stackCount) tackleKnockout(c2, c1);
          }
        }
      }
    }

    function tackleKnockout(winner, loser) {
      if (loser.stunTimer > 0 || loser.invulnerableTimer > 0) return;
      loser.stunTimer = 1.4;
      sound.playTackle();
      const drops = Math.max(2, Math.floor(loser.stackCount * 0.5));
      scatterBricks(loser, drops);
      const kx = loser.pos.x - winner.pos.x, kz = loser.pos.z - winner.pos.z;
      const mag = Math.hypot(kx, kz) || 1;
      const pushX = (kx / mag) * 2.0;
      const pushZ = (kz / mag) * 2.0;
      const stage = STAGES[loser.currentStage];
      if (stage) {
        const nextX = loser.pos.x + pushX;
        const nextZ = loser.pos.z + pushZ;
        const distToCenter = Math.hypot(nextX, nextZ - stage.z);
        if (distToCenter > stage.r) {
          const normX = nextX / distToCenter;
          const normZ = (nextZ - stage.z) / distToCenter;
          loser.pos.x = normX * (stage.r - 0.5);
          loser.pos.z = stage.z + normZ * (stage.r - 0.5);
        } else {
          loser.pos.x = nextX;
          loser.pos.z = nextZ;
        }
      } else {
        loser.pos.x += pushX;
        loser.pos.z += pushZ;
      }
    }

    function setupControls() {
      const zone = document.getElementById('touch-control-layer');
      let touchId = null, startX = 0, startY = 0;

      function onPointerStart(x, y, id) { sound.init(); touchId = id; startX = x; startY = y; input.active = true; }
      function onPointerMove(x, y) {
        if (!input.active) return;
        const dx = x - startX, dy = y - startY, dist = Math.hypot(dx, dy), maxDist = 55;
        if (dist > 0) {
          const clamped = Math.min(dist, maxDist);
          input.x = Math.cos(Math.atan2(dy, dx)) * (clamped / maxDist);
          input.y = Math.sin(Math.atan2(dy, dx)) * (clamped / maxDist);
        }
      }
      function onPointerEnd() { input.active = false; input.x = 0; input.y = 0; touchId = null; }

      if (zone) {
        zone.addEventListener('touchstart', e => { 
          if (e.touches.length > 0) onPointerStart(e.touches[0].clientX, e.touches[0].clientY, e.touches[0].identifier); 
        }, { passive: false });
        window.addEventListener('touchmove', e => { 
          if (!input.active) return; 
          for (let i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === touchId) { onPointerMove(e.touches[i].clientX, e.touches[i].clientY); break; } 
          }
        }, { passive: false });
        window.addEventListener('touchend', onPointerEnd, { passive: false });
        window.addEventListener('touchcancel', onPointerEnd, { passive: false });
        zone.addEventListener('mousedown', e => { if (e.button === 0) onPointerStart(e.clientX, e.clientY, 'mouse'); });
        window.addEventListener('mousemove', e => { if (input.active && touchId === 'mouse') onPointerMove(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { if (touchId === 'mouse') onPointerEnd(); });
      }

      const soundBtn = document.getElementById('btn-sound');
      const iconSoundOff = document.getElementById('icon-sound-off');
      const iconSoundOn = document.getElementById('icon-sound-on');
      if (soundBtn) {
        soundBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          sound.init();
          const isMuted = sound.toggleMute();
          if (iconSoundOff && iconSoundOn) {
            if (isMuted) {
              iconSoundOff.classList.remove('hidden');
              iconSoundOn.classList.add('hidden');
            } else {
              iconSoundOff.classList.add('hidden');
              iconSoundOn.classList.remove('hidden');
            }
          }
        });
      }

      const startBtn = document.getElementById('btn-start');
      function onStartClick(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        sound.init();
        const modal = document.getElementById('modal-start');
        if (modal) {
          modal.style.display = 'none';
          modal.classList.add('hidden');
        }
        gameStarted = true;
      }
      if (startBtn) {
        startBtn.addEventListener('click', onStartClick);
        startBtn.addEventListener('touchend', onStartClick);
      }

      const restartBtn = document.getElementById('btn-restart');
      if (restartBtn) {
        restartBtn.addEventListener('click', resetGame);
        restartBtn.addEventListener('touchend', resetGame);
      }
    }

    let lastTime = performance.now(), blockSpawnTimer = 0, cleanupTimer = 0;
    function animate(currentTime) {
      requestAnimationFrame(animate);
      const dt = Math.min((currentTime - lastTime) / 1000, 0.05); 
      lastTime = currentTime;

      if (gameStarted && !isGameOver) {
        updateCharacters(dt);
        
        blockSpawnTimer += dt;
        if (blockSpawnTimer > 0.5) { manageBlockSpawns(); blockSpawnTimer = 0; }
        
        cleanupTimer += dt;
        if (cleanupTimer > 2.0) { cleanupOldData(); cleanupTimer = 0; }
        
        const maxStage = Math.max(...characters.map(c => c.currentStage));
        if (maxStage >= STAGES.length - 3) extendCourse();

        timeLeft -= dt;
        if (timeLeft <= 0) { timeLeft = 0; onTimeUp(); }
        updateTimerHUD();

        const timeSec = currentTime * 0.001;

        floorItems.forEach(item => {
          if (item.active && item.group) {
            if (item.crystal) {
              item.crystal.rotation.y = timeSec * 3.2;
              item.crystal.rotation.z = Math.sin(timeSec * 2.5) * 0.25;
              item.crystal.position.y = 1.35 + Math.sin(timeSec * 4.5 + item.stageIdx) * 0.22;
            }
            if (item.beaconRing) {
              const pulse = 1.0 + Math.sin(timeSec * 5.0) * 0.25;
              item.beaconRing.scale.set(pulse, pulse, pulse);
            }
          }
        });

        for (let i = 0; i < projectilePool.length; i++) {
          const p = projectilePool[i];
          if (!p.active) continue;

          p.progress += dt / p.duration;

          if (p.target) {
            p.targetPos.copy(p.target.pos);
            p.targetPos.y += 1.0;
          }

          const t = Math.min(1.0, p.progress);
          _tempVec3A.lerpVectors(p.startPos, p.targetPos, t);
          _tempVec3A.y += Math.sin(t * Math.PI) * 5.2;
          p.group.position.copy(_tempVec3A);

          if (p.crystal) {
            p.crystal.rotation.x += dt * 22;
            p.crystal.rotation.y += dt * 28;
          }
          if (p.ring1) p.ring1.rotation.z += dt * 14;
          if (p.ring2) p.ring2.rotation.y += dt * 18;

          if (p.history && p.history.length > 0) {
            const recycledVec = p.history.pop();
            recycledVec.copy(_tempVec3A);
            p.history.unshift(recycledVec);
          }

          if (p.trailSpheres) {
            for (let j = 0; j < p.trailSpheres.length; j++) {
              const item = p.trailSpheres[j];
              const histIdx = Math.min(p.history.length - 1, item.historyOffset);
              if (p.history[histIdx]) {
                item.mesh.position.copy(p.history[histIdx]);
                item.mesh.visible = true;
                const lifeFade = 1.0 - (j / p.trailSpheres.length);
                item.material.opacity = (1.0 - t * 0.2) * lifeFade * 0.92;
              }
            }
          }

          if (p.progress >= 1.0) {
            sound.playAttackHit();

            triggerLandingShockwave(p.targetPos.x, p.targetPos.y - 0.8, p.targetPos.z, 3.8, 0xf43f5e);

            if (p.target) {
              p.target.stunTimer = 1.4;
              scatterBricks(p.target, 3);

              const drainCount = 4;
              let spawned = 0;
              for (let d = 0; d < drainBlockPool.length && spawned < drainCount; d++) {
                const db = drainBlockPool[d];
                if (!db.active) {
                  db.active = true;
                  db.targetChar = p.shooter;
                  db.index = spawned;
                  db.delay = spawned * 0.08;
                  db.progress = 0;
                  db.duration = 0.55;

                  const sOffset = _tempVec3B.set(
                    (Math.random() - 0.5) * 1.5,
                    1.0 + Math.random() * 1.0,
                    (Math.random() - 0.5) * 1.5
                  );
                  db.startPos.copy(p.target.pos).add(sOffset);
                  db.mesh.position.copy(db.startPos);
                  db.mesh.visible = true;
                  spawned++;
                }
              }
            }

            p.active = false;
            p.group.visible = false;
            if (p.trailSpheres) {
              for (let j = 0; j < p.trailSpheres.length; j++) {
                p.trailSpheres[j].mesh.visible = false;
              }
            }
          }
        }

        for (let i = 0; i < drainBlockPool.length; i++) {
          const d = drainBlockPool[i];
          if (!d.active) continue;

          if (d.delay > 0) {
            d.delay -= dt;
            continue;
          }
          d.progress += dt / d.duration;
          const prog = Math.min(1.0, d.progress);

          _tempVec3A.copy(d.targetChar.pos);
          _tempVec3A.y += 1.4;
          _tempVec3A.z += 0.2;

          const easeT = prog * prog * (3 - 2 * prog);
          _tempVec3B.lerpVectors(d.startPos, _tempVec3A, easeT);
          _tempVec3B.y += Math.sin(prog * Math.PI) * 2.2;
          d.mesh.position.copy(_tempVec3B);
          d.mesh.rotation.y += dt * 18;
          d.mesh.rotation.x += dt * 14;

          if (d.progress >= 1.0) {
            addBrickToCharacter(d.targetChar, d.targetChar.team, 1);
            if (d.targetChar.isPlayer) {
              sound.playDrainCollect(d.index || 0);
            }
            d.active = false;
            d.mesh.visible = false;
          }
        }

        for (let i = activeMagnetBlocks.length - 1; i >= 0; i--) {
          const mb = activeMagnetBlocks[i];
          mb.progress += dt / mb.duration;
          const prog = Math.min(1.0, mb.progress);

          _tempVec3A.copy(mb.targetChar.pos);
          const stackH = Math.min(mb.targetChar.stackCount * 0.22, 3.2);
          _tempVec3A.y += 0.85 + stackH;
          _tempVec3A.z -= 0.35;

          const easeT = prog * prog * (3 - 2 * prog);
          _tempVec3B.lerpVectors(mb.startPos, _tempVec3A, easeT);
          _tempVec3B.y += Math.sin(prog * Math.PI) * 1.35;
          mb.mesh.position.copy(_tempVec3B);
          mb.mesh.rotation.y += dt * 16;
          mb.mesh.rotation.x += dt * 12;

          if (mb.progress >= 1.0) {
            addBrickToCharacter(mb.targetChar, mb.targetChar.team, 1);
            if (mb.targetChar.isPlayer) {
              sound.playMagnetDock(magnetDockStepCounter++);
            }
            mb.targetChar.meshObj.stackGroup.scale.set(1.08, 1.12, 1.08);
            setTimeout(() => {
              if (mb.targetChar && mb.targetChar.meshObj) {
                mb.targetChar.meshObj.stackGroup.scale.set(1.0, 1.0, 1.0);
              }
            }, 75);

            disposeHierarchy(mb.mesh);
            scene.remove(mb.mesh);
            activeMagnetBlocks.splice(i, 1);
          }
        }

        for (let i = 0; i < puffCloudPool.length; i++) {
          const puff = puffCloudPool[i];
          if (!puff.active) continue;
          puff.life += dt;
          const prog = puff.life / puff.maxLife;
          if (prog >= 1.0) {
            puff.active = false;
            puff.mesh.visible = false;
          } else {
            const currentScale = puff.initScale * (1.0 - prog * 0.85);
            puff.mesh.scale.set(currentScale, currentScale, currentScale);
            puff.mesh.position.y += dt * 0.45;
          }
        }

        for (let i = 0; i < speedStepRingPool.length; i++) {
          const sRing = speedStepRingPool[i];
          if (!sRing.active) continue;
          sRing.life += dt;
          const prog = sRing.life / sRing.maxLife;
          if (prog >= 1.0) {
            sRing.active = false;
            sRing.mesh.visible = false;
          } else {
            sRing.scale += dt * 3.4;
            sRing.mesh.scale.set(sRing.scale, sRing.scale, sRing.scale);
            sRing.mesh.material.opacity = (1.0 - prog) * 0.75;
          }
        }

        curvedSlideBonusBlocks.forEach(blk => {
          if (!blk.collected && blk.mesh) {
            blk.mesh.rotation.y = timeSec * 2.8 + blk.t * 4.0;
          }
        });

        ziplineBonusBlocks.forEach(blk => {
          if (!blk.collected && blk.mesh) {
            blk.mesh.rotation.y = timeSec * 3.2 + blk.t * 4.5;
            blk.mesh.position.y = blk.baseY + Math.sin(timeSec * 3.5 + blk.zi) * 0.14;
          }
        });

        cloudObjects.forEach(c => {
          c.mesh.position.y = c.baseY + Math.sin(timeSec + c.offset) * 0.4;
          c.mesh.rotation.y = Math.sin(timeSec * 0.3 + c.offset) * 0.08;
        });

        for (let i = 0; i < shockwavePool.length; i++) {
          const sw = shockwavePool[i];
          if (!sw.active) continue;
          sw.life += dt;
          const growRate = (sw.targetRadiusScale || 1.0) * 6.5;
          sw.scale += dt * growRate;
          sw.mesh.scale.set(sw.scale, sw.scale, sw.scale);
          sw.mesh.material.opacity = Math.max(0, 0.9 - sw.life * 2.2);
          if (sw.life > 0.45) {
            sw.active = false;
            sw.mesh.visible = false;
          }
        }
      }

      if (player && camera) {
        if (dirLight) {
          dirLight.position.set(player.pos.x + 30, player.pos.y + 70, player.pos.z + 25);
          dirLight.target.position.set(player.pos.x, player.pos.y, player.pos.z);
          dirLight.target.updateMatrixWorld();
        }

        const currentStageObj = STAGES[player.currentStage];
        const nextConn = CONNECTIONS.find(c => c.from === player.currentStage);
        const isVerticalClimb = (nextConn && nextConn.type === 'vertical' && player.pos.z < (currentStageObj ? currentStageObj.z - currentStageObj.r * 0.8 : 0));
        const isSlideRiding = player.onSlide;
        const isCurvedRiding = player.onCurvedSlide;
        const isZiplining = player.onZipline;
        const isJumping = player.isJumping;

        let targetCamX = player.pos.x * 0.2;
        let targetCamY = player.pos.y + 24; 
        let targetCamZ = player.pos.z + 12;
        let targetLookX = player.pos.x * 0.1;
        let targetLookY = player.pos.y;
        let targetLookAheadZ = player.pos.z - 5;
        let targetFOV = player.speedBoostActive ? 65 : 60;

        if (attackCamTimer > 0) {
          attackCamTimer -= dt;
          targetCamZ += 3.5;
          targetCamY += 2.0;
          targetFOV = 68;
        }

        if (isJumping && player.activeJumpTier) {
          const jTier = player.activeJumpTier;
          const t = player.jumpProgress;
          if (jTier.id === 'mega') {
            targetCamY = player.pos.y + 14;
            targetCamZ = player.pos.z + 16;
            targetLookY = player.pos.y - 6;
            targetLookAheadZ = player.pos.z - 30;
            targetFOV = 60 + Math.sin(t * Math.PI) * 18;
          } else if (jTier.id === 'high') {
            targetCamY = player.pos.y + 18;
            targetCamZ = player.pos.z + 14;
            targetLookY = player.pos.y - 2;
            targetLookAheadZ = player.pos.z - 18;
            targetFOV = 60 + Math.sin(t * Math.PI) * 6;
          } else {
            targetCamY = player.pos.y + 20;
            targetCamZ = player.pos.z + 12;
            targetFOV = 60;
          }
        } else if (isVerticalClimb) {
          targetCamY = player.pos.y + 26;
          targetCamZ = player.pos.z + 16;
          targetLookY = player.pos.y + 4;
          targetFOV = 65;
        } else if (isZiplining) {
          targetCamX = player.pos.x + 5.6;
          targetCamY = player.pos.y + 4.2;
          targetCamZ = player.pos.z + 11.5;
          targetLookX = player.pos.x - 0.4;
          targetLookY = player.pos.y + 0.6;
          targetLookAheadZ = player.pos.z - 18;
          targetFOV = 68;
        } else if (isCurvedRiding) {
          targetCamY = player.pos.y + 16;
          targetCamZ = player.pos.z + 9;
          targetLookY = player.pos.y - 1.2;
          targetFOV = 67;
        } else if (isSlideRiding) {
          targetCamY = player.pos.y + 18;
          targetCamZ = player.pos.z + 9;
          targetLookY = player.pos.y - 1;
          targetFOV = 63;
        }

        const lerpFactorPos = isJumping ? 0.10 : 0.14;
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, lerpFactorPos);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, targetCamY, 0.16);
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetCamZ, lerpFactorPos);

        if (Math.abs(camera.fov - targetFOV) > 0.1) {
          camera.fov = THREE.MathUtils.lerp(camera.fov, targetFOV, 0.08);
          camera.updateProjectionMatrix();
        }
        
        camera.lookAt(targetLookX, targetLookY, targetLookAheadZ);

        if (seaMesh) {
          seaMesh.position.z = player.pos.z - 200;
        }
      }
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    function bootGame() {
      if (window._gameEngineBooted) return;
      window._gameEngineBooted = true;
      try {
        initThree(); 
        animate(performance.now());
      } catch (err) {
        console.error("Game boot failed:", err);
      }
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      bootGame();
    } else {
      document.addEventListener('DOMContentLoaded', bootGame);
      window.addEventListener('load', bootGame);
    }
  </script>
</body>
</html>
