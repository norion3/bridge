<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>くねくねバトル オンライン</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0b051a; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .loader-spinner {
            width: 42px; height: 42px;
            border: 3px solid rgba(0, 229, 255, 0.2);
            border-top-color: #00e5ff; border-radius: 50%;
            animation: l-spin 0.8s linear infinite;
        }
        @keyframes l-spin { to { transform: rotate(360deg); } }
        .loader-text {
            color: #00e5ff; font-size: 13px; font-weight: 700;
            letter-spacing: 2px; margin-top: 14px;
        }
    </style>
</head>
<body>
    <div id="loader-shield">
        <div class="loader-spinner"></div>
        <div class="loader-text">CONNECTING...</div>
    </div>

    <!-- WebKitのパス解決バグを回避する完全絶対URL ＆ 5分単位キャッシュバスター -->
    <script type="module">
        const cacheBuster = Math.floor(Date.now() / 300000);
        import(`https://norion3.github.io/kunekune/main.js?v=${cacheBuster}`).catch(err => {
            console.error('[Loader] Failed to load main.js:', err);
            const t = document.querySelector('.loader-text');
            if (t) t.innerText = 'LOAD ERROR';
        });
    </script>
</body>
</html>
