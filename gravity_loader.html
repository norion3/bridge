<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- GRAVITYドメイン上での相対パス解決をGitHub Pages基準へ強制固定 -->
  <base href="https://norion3.github.io/bridge/">
  <title>階段を架けろ！</title>

  <!-- プラットフォーム・共通CDNライブラリ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.gravity.place/fe/sdk/index-1.0.2.min.js"></script>

  <style>
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* GitHub本体JSがロード・マウントされるまでの初期スプラッシュ画面 */
    #engine-boot-splash {
      position: absolute;
      inset: 0;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #0284c7 0%, #0f172a 100%);
      color: #ffffff;
      transition: opacity 0.4s ease-out;
    }
    .boot-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: bootSpin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes bootSpin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="font-sans antialiased">
  <div id="app-container">
    <!-- 初期接続スプラッシュ -->
    <div id="engine-boot-splash">
      <div class="boot-spinner"></div>
      <div style="font-size: 20px; font-weight: 900; letter-spacing: 0.05em; text-shadow: 0 2px 8px rgba(0,0,0,0.5);">階段を架けろ！</div>
      <div style="font-size: 13px; color: #94a3b8; margin-top: 6px;">Connecting to Server...</div>
    </div>
  </div>

  <!-- GitHub本体コードの動的ブートストラップ（キャッシュバスター付き絶対URL） -->
  <script type="module">
    // 5分単位のタイムスタンプで端末WebViewのキャッシュ滞留を抑止し、GitHub最新コードを即時反映
    const cacheBuster = Math.floor(Date.now() / (1000 * 300));
    const scriptUrl = `https://norion3.github.io/bridge/main.js?v=${cacheBuster}`;

    import(scriptUrl)
      .then(() => {
        const splash = document.getElementById('engine-boot-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 400);
        }
      })
      .catch((err) => {
        console.error('[GRAVITY Loader] Failed to load remote game assets:', err);
        const splash = document.getElementById('engine-boot-splash');
        if (splash) {
          splash.innerHTML = `
            <div style="font-size: 16px; font-weight: bold; color: #f87171;">通信エラーが発生しました</div>
            <div style="font-size: 12px; color: #cbd5e1; margin-top: 8px;">電波状況の良い場所で再度お試しください</div>
            <button onclick="location.reload()" style="margin-top: 16px; padding: 10px 20px; background: #0284c7; color: #fff; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;">再読み込み</button>
          `;
        }
      });
  </script>
</body>
</html>
